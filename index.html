<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mise-On : Smart Kitchen System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
        #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #cbd5e1; gap: 1px; border: 1px solid #cbd5e1; flex: 1; overflow-y: auto; }
        .calendar-grid { grid-auto-rows: minmax(60px, 1fr); } 
        @media (min-width: 1024px) { .calendar-grid { grid-template-rows: 25px repeat(6, 1fr); grid-auto-rows: auto; } }
        .calendar-header { background: #f8fafc; text-align: center; font-size: 9px; font-weight: 900; color: #94a3b8; padding: 4px 0; }
        .calendar-day { background: white; padding: 2px 4px; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; min-height: 0; position: relative; }
        .calendar-day.selected { background: #eff6ff !important; box-shadow: inset 0 0 0 2px #3b82f6; z-index: 10; }
        .menu-text { font-size: 9px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; padding: 1px 2px; border-radius: 2px; }
        
        .modal-view { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; padding: 15px; animation: slideUp 0.3s ease-out; }
        .recipe-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        
        .login-screen { position: fixed; inset: 0; background: #f8fafc; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 320px; text-align: center; }
        .login-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; transition: all 0.2s; font-weight: 700; }
        .login-btn { width: 100%; background: #3b82f6; color: white; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 14px; margin-top: 4px; }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const normalizeDate = (dStr) => {
            if (!dStr) return "";
            const str = String(dStr).trim();
            let match = str.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) {
                return `${match[1]}-${String(match[2]).padStart(2, '0')}-${String(match[3]).padStart(2, '0')}`;
            }
            match = str.match(/(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) {
                return `2026-${String(match[1]).padStart(2, '0')}-${String(match[2]).padStart(2, '0')}`;
            }
            const digits = str.replace(/[^\d]/g, "");
            if (digits.length === 8) {
                return `${digits.substring(0,4)}-${digits.substring(4,6)}-${digits.substring(6,8)}`;
            }
            return str;
        };

        const compressImage = (file, maxWidth = 1000, quality = 0.75) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl.split(',')[1]);
                    };
                    img.onerror = () => resolve(null);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        };

        const MiseOnApp = () => {
            const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1ipSLhBGgAW1U_RF9Xkez3hUl_Eiklyor-OeQ-DtHV9o/edit?usp=sharing"; 
            const USER_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=1190342038&single=true&output=csv";
            const MENU_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=0&single=true&output=csv";
            const COMMENT_WRITE_URL = "https://script.google.com/macros/s/AKfycbwgiUhKY0oZiG4g0peqqpHWpOYeuAZN-n0JOvx9NXuLZw2grZCqnNRRab0SuX4Fl2xSXg/exec";

            const ADMIN_NAME = "관리자";
            const ADMIN_CODE = "2026";

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState("");
            const [inputName, setInputName] = useState("");
            const [inputCode, setInputCode] = useState("");
            const [loginError, setLoginError] = useState("");
            const [userList, setUserList] = useState([]);
            
            const [menus, setMenus] = useState([]);
            const [isUploading, setIsUploading] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const [currentMonth, setCurrentMonth] = useState(new Date()); 
            const [selectedDate, setSelectedDate] = useState(null);

            // 재고 관련 State
            const [inventoryModal, setInventoryModal] = useState(false);
            const [inventoryList, setInventoryList] = useState([]);
            const [invoiceModal, setInvoiceModal] = useState(false);
            
            // 등록용 임시 식재료 항목들
            const [inputItems, setInputItems] = useState([
                { name: "한우꼬리 반골", temp: "냉장", inQty: 1, unit: "kg" },
                { name: "잡뼈", temp: "냉장", inQty: 1, unit: "kg" }
            ]);
            const [invoicePhotoUrl, setInvoicePhotoUrl] = useState("");

            const fetchInventoryData = () => {
                fetch(`${COMMENT_WRITE_URL}?action=inventory&t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data)) setInventoryList(data);
                })
                .catch(err => console.log(err));
            };

            const fetchData = () => {
                Papa.parse(USER_URL, { 
                    download: true, header: false,
                    complete: (res) => {
                        const users = [];
                        if (res && res.data) {
                            res.data.forEach(row => { if (row.length >= 2 && row[1]) users.push({ name: (row[0]||"").trim(), code: (row[1]||"").trim() }); });
                        }
                        setUserList(users);
                    }
                });

                Papa.parse(MENU_URL, { 
                    download: true, 
                    complete: (res) => {
                        let temp = []; let headers = [];
                        if (res && res.data) {
                            res.data.forEach(row => {
                                const label = (row[0] || "").replace(/\s/g, "");
                                const vals = row.slice(1);
                                if (label === "날짜") {
                                    headers = vals.map(v => normalizeDate(v));
                                    headers.forEach(d => { if(d) temp.push({ date: d, morning: "", lunch: "", dinner: "" }); });
                                } else if (headers.length > 0) {
                                    vals.forEach((v, i) => {
                                        if (!headers[i]) return;
                                        const t = temp.find(m => m.date === headers[i]);
                                        if (t && v && String(v).trim() !== "") {
                                            if (label.includes("아침")) t.morning = v;
                                            else if (label.includes("점심")) t.lunch = v;
                                            else if (label.includes("저녁")) t.dinner = v;
                                        }
                                    });
                                }
                            });
                        }
                        setMenus(temp);
                        const todayStr = normalizeDate(new Date().toISOString().split('T')[0]);
                        setSelectedDate(temp.find(m => m.date === todayStr) || { date: todayStr, morning: "", lunch: "", dinner: "" });
                    }
                });

                fetchInventoryData();
            };

            useEffect(() => { if (isAuthenticated) fetchData(); }, [isAuthenticated]);
            useEffect(() => { const saved = localStorage.getItem("misoyon_user"); if (saved) { setIsAuthenticated(true); setCurrentUser(saved); } }, []);

            const handleLogin = () => {
                const foundUser = userList.find(u => u.name === inputName.trim() && u.code === inputCode.trim());
                if (foundUser) { setIsAuthenticated(true); setCurrentUser(foundUser.name); localStorage.setItem("misoyon_user", foundUser.name); }
                else if (inputName.trim() === ADMIN_NAME && inputCode.trim() === ADMIN_CODE) { setIsAuthenticated(true); setCurrentUser("관리자"); localStorage.setItem("misoyon_user", "관리자"); }
                else { setLoginError("이름 또는 코드를 확인하세요."); }
            };

            const handleLogout = () => { setIsAuthenticated(false); setCurrentUser(""); localStorage.removeItem("misoyon_user"); window.location.reload(); };

            // 명세서 사진 구글 드라이브 업로드 (증빙 보관용)
            const handleInvoicePhotoUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);

                try {
                    const base64Data = await compressImage(file, 1000, 0.75);
                    fetch(COMMENT_WRITE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'upload_invoice_photo',
                            imageBase64: base64Data
                        })
                    })
                    .then(res => res.json())
                    .then(resData => {
                        setIsUploading(false);
                        if (resData.status === 'success' && resData.url) {
                            setInvoicePhotoUrl(resData.url);
                            alert("명세서 사진 증빙이 구글 드라이브에 안전하게 보관되었습니다!");
                        }
                    })
                    .catch(() => {
                        setIsUploading(false);
                        alert("사진 업로드 실패");
                    });
                } catch(err) {
                    setIsUploading(false);
                }
            };

            // 목록 행 추가 / 삭제
            const handleAddRow = () => {
                setInputItems([...inputItems, { name: "", temp: "냉장", inQty: 1, unit: "kg" }]);
            };

            const handleRemoveRow = (index) => {
                setInputItems(inputItems.filter((_, idx) => idx !== index));
            };

            const handleInputChange = (index, field, value) => {
                const updated = [...inputItems];
                updated[index][field] = value;
                setInputItems(updated);
            };

            // 최종 일괄 입고 저장
            const handleConfirmInventory = () => {
                const validItems = inputItems.filter(item => item.name.trim() !== "");
                if (validItems.length === 0) return alert("입고할 품목명을 입력하세요.");
                setIsSubmitting(true);

                fetch(COMMENT_WRITE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'batch_add_inventory',
                        items: validItems,
                        invoiceUrl: invoicePhotoUrl
                    })
                })
                .then(res => res.json())
                .then(() => {
                    alert(`${validItems.length}개 식재료 입고 저장이 완료되었습니다!`);
                    setInvoiceModal(false);
                    setIsSubmitting(false);
                    fetchInventoryData();
                })
                .catch(() => {
                    alert("저장 실패");
                    setIsSubmitting(false);
                });
            };

            // 실시간 재고 사용량 차감
            const handleUpdateQty = (item, newUsedQty) => {
                if (newUsedQty < 0) return;
                const updatedList = inventoryList.map(inv => inv.name === item.name ? { ...inv, usedQty: newUsedQty, currentQty: inv.inQty - newUsedQty } : inv);
                setInventoryList(updatedList);

                fetch(COMMENT_WRITE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'update_inventory',
                        rowNum: item.rowNum,
                        name: item.name,
                        usedQty: newUsedQty
                    })
                });
            };

            const calDays = useMemo(() => {
                const year = currentMonth.getFullYear(), month = currentMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const lastDate = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= lastDate; i++) {
                    const ds = normalizeDate(`${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
                    days.push({ day: i, dateStr: ds, data: menus.find(m => m.date === ds) });
                }
                while (days.length < 42) days.push(null);
                return days;
            }, [currentMonth, menus]);

            const weekDays = ['일','월','화','수','목','금','토'];

            if (!isAuthenticated) {
                return (
                    <div className="login-screen">
                        <div className="login-box">
                            <h1 className="text-3xl font-black italic tracking-tighter mb-2">Mise-On</h1>
                            <p className="text-xs text-blue-600 font-bold mb-1 uppercase tracking-widest">Digital Mise-en-place</p>
                            <p className="text-[10px] text-slate-400 font-bold mb-6">Powered by Chef D.S. Kim</p>
                            <input type="text" className="login-input" placeholder="이름 (Name)" value={inputName} onChange={e => setInputName(e.target.value)} />
                            <input type="password" inputMode="numeric" className="login-input" placeholder="비밀번호 (Code)" value={inputCode} onChange={e => setInputCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} className="login-btn">LOGIN</button>
                            {loginError && <p className="text-red-500 text-xs font-bold mt-3">{loginError}</p>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full w-full">
                    <header className="flex flex-col px-4 py-3 bg-white border-b gap-3 shrink-0">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-black italic tracking-tighter">Mise-On <span className="text-blue-600 text-xs not-italic">v1.6</span></h1>
                                <div className="text-[10px] text-slate-400 font-bold">Smart Kitchen System</div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => { setInventoryModal(true); fetchInventoryData(); }} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-black text-xs shadow-sm hover:bg-emerald-700">📦 재고 관리</button>
                                {currentUser === ADMIN_NAME && (
                                    <a href={SHEET_EDIT_URL} target="_blank" rel="noopener noreferrer" className="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl border border-indigo-200 font-black text-xs shadow-sm hover:bg-indigo-100 no-underline">⚙️ 시트 관리</a>
                                )}
                                <button onClick={handleLogout} className="bg-red-500 text-white px-3 py-1.5 rounded-xl font-black text-xs">OUT</button>
                            </div>
                        </div>
                    </header>

                    <main className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                        <div className="flex-[2] flex flex-col min-h-[55%] lg:min-h-full border-b lg:border-b-0 lg:border-r overflow-hidden">
                            <div className="calendar-grid">
                                {weekDays.map(d=><div key={d} className="calendar-header">{d}</div>)}
                                {calDays.map((d,i)=>(
                                    <div key={i} className={`calendar-day ${d?.dateStr === selectedDate?.date ? 'selected' : ''}`} onClick={()=>d?.data && setSelectedDate(d.data)}>
                                        {d && (<><span className={`text-[10px] font-black ${d.data ? 'text-slate-800' : 'text-slate-300'}`}>{d.day}</span>
                                        {d.data && (<div className="flex flex-col gap-[1px] mt-[1px]">
                                            {d.data.morning && <div className="menu-text bg-orange-50 text-orange-600">조:{d.data.morning}</div>}
                                            {d.data.lunch && <div className="menu-text bg-blue-50 text-blue-600">중:{d.data.lunch}</div>}
                                            {d.data.dinner && <div className="menu-text bg-purple-50 text-purple-600">석:{d.data.dinner}</div>}
                                        </div>)}</>)}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <aside className="flex-1 bg-white p-4 overflow-y-auto min-h-[45%]">
                            {selectedDate ? (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center border-b-2 border-blue-600 pb-1">
                                        <h2 className="text-xl font-black italic">DAILY MENU</h2>
                                    </div>
                                    <div className="font-bold text-slate-500 text-sm mb-2">{selectedDate.date}</div>

                                    <div className="p-3 bg-slate-50 rounded-xl border mb-2">
                                        <div className="text-[10px] font-black text-slate-400 uppercase">Morning</div>
                                        <div className="text-sm font-black text-slate-700">{selectedDate.morning || "일정없음"}</div>
                                    </div>
                                    <div className="p-3 bg-slate-50 rounded-xl border mb-2">
                                        <div className="text-[10px] font-black text-slate-400 uppercase">Lunch</div>
                                        <div className="text-sm font-black text-slate-700">{selectedDate.lunch || "일정없음"}</div>
                                    </div>
                                    <div className="p-3 bg-slate-50 rounded-xl border mb-2">
                                        <div className="text-[10px] font-black text-slate-400 uppercase">Dinner</div>
                                        <div className="text-sm font-black text-slate-700">{selectedDate.dinner || "일정없음"}</div>
                                    </div>
                                </div>
                            ) : <div className="h-full flex items-center justify-center text-slate-300 font-black">SELECT DATE</div>}
                        </aside>
                    </main>

                    {/* 📦 재고 현황 보기 모달 */}
                    {inventoryModal && (
                        <div className="modal-view bg-slate-100">
                            <div className="flex justify-between items-center mb-4 bg-white p-4 rounded-2xl border shadow-sm">
                                <div>
                                    <h2 className="text-xl font-black text-emerald-700 italic">📦 식재료 재고 관리</h2>
                                    <p className="text-[10px] font-bold text-slate-400">실시간 입고 및 사용량 현황</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setInvoiceModal(true)} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow-md hover:bg-emerald-700">➕ 식재료 간편 입고 등록</button>
                                    <button onClick={() => setInventoryModal(false)} className="text-2xl font-bold text-slate-400 px-2">×</button>
                                </div>
                            </div>

                            <div className="flex-1 bg-white rounded-2xl border overflow-y-auto p-2">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b bg-slate-50 text-[11px] font-black text-slate-500">
                                            <th className="p-2">보관온도</th>
                                            <th className="p-2">품목명</th>
                                            <th className="p-2 text-center">입고량</th>
                                            <th className="p-2 text-center">사용량</th>
                                            <th className="p-2 text-center">현재재고</th>
                                            <th className="p-2 text-right">최근입고일</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y text-xs font-bold">
                                        {inventoryList.map((item, idx) => {
                                            const curQty = Number(item.currentQty) || 0;
                                            return (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="p-2 text-[10px]">
                                                        <span className={`px-2 py-0.5 rounded-md text-white font-black ${item.temp === '냉동' ? 'bg-cyan-600' : item.temp === '실온' ? 'bg-amber-600' : 'bg-blue-500'}`}>{item.temp || '냉장'}</span>
                                                    </td>
                                                    <td className="p-2 font-black text-slate-800">{item.name}</td>
                                                    <td className="p-2 text-center font-black text-slate-700">{item.inQty}</td>
                                                    <td className="p-2 text-center">
                                                        <div className="flex items-center justify-center gap-1">
                                                            <button onClick={() => handleUpdateQty(item, (Number(item.usedQty)||0) - 1)} className="w-6 h-6 bg-slate-200 rounded font-black text-xs">-</button>
                                                            <span className="w-8 text-center font-black text-indigo-600">{item.usedQty || 0}</span>
                                                            <button onClick={() => handleUpdateQty(item, (Number(item.usedQty)||0) + 1)} className="w-6 h-6 bg-slate-200 rounded font-black text-xs">+</button>
                                                        </div>
                                                    </td>
                                                    <td className="p-2 text-center font-black text-sm text-emerald-600">{curQty}</td>
                                                    <td className="p-2 text-right text-[10px] text-slate-400">{item.lastDate}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* ➕ 간편 입고 등록 및 명세서 증빙 업로드 모달 */}
                    {invoiceModal && (
                        <div className="recipe-popup" onClick={() => setInvoiceModal(false)}>
                            <div className="bg-white rounded-3xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center border-b pb-3">
                                    <div>
                                        <h3 className="text-xl font-black text-emerald-700">➕ 식재료 간편 입고 등록</h3>
                                        <p className="text-xs font-bold text-slate-400">명세서 실물 사진 증빙 보관 + 빠른 수기 입고</p>
                                    </div>
                                    <button onClick={() => setInvoiceModal(false)} className="text-3xl font-thin text-slate-400">×</button>
                                </div>

                                {/* 📷 명세서 사진 증빙 저장 */}
                                <div className="flex items-center justify-between p-3 border rounded-2xl bg-emerald-50">
                                    <div>
                                        <div className="text-xs font-black text-emerald-800">📷 거래명세서 사진 증빙 업로드</div>
                                        <div className="text-[10px] text-slate-400 font-bold">사진이 구글 드라이브에 안전하게 보관됩니다.</div>
                                    </div>
                                    <label className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-black text-xs cursor-pointer shadow-md hover:bg-emerald-700">
                                        {isUploading ? "업로드 중..." : invoicePhotoUrl ? "✅ 사진 보관 완료" : "📷 촬영/선택"}
                                        <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleInvoicePhotoUpload} disabled={isUploading} />
                                    </label>
                                </div>

                                {/* ⚡ 빠른 식재료 목록 입력 테이블 */}
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center">
                                        <h4 className="text-xs font-black text-slate-700">입고할 식재료 항목</h4>
                                        <button onClick={handleAddRow} className="bg-slate-800 text-white px-2.5 py-1 rounded-lg text-xs font-black">+ 행 추가</button>
                                    </div>

                                    <div className="border rounded-2xl p-2 bg-slate-50 space-y-2">
                                        {inputItems.map((item, idx) => (
                                            <div key={idx} className="flex gap-1.5 items-center bg-white p-2 rounded-xl border">
                                                <select className="px-2 py-1.5 bg-slate-100 rounded-lg text-xs font-bold border" value={item.temp} onChange={e => handleInputChange(idx, 'temp', e.target.value)}>
                                                    <option value="냉장">냉장</option>
                                                    <option value="냉동">냉동</option>
                                                    <option value="실온">실온</option>
                                                </select>
                                                <input className="flex-1 px-3 py-1.5 rounded-lg border text-xs font-bold" placeholder="품목명 (예: 한우꼬리 반골)" value={item.name} onChange={e => handleInputChange(idx, 'name', e.target.value)} />
                                                <input type="number" className="w-14 px-2 py-1.5 rounded-lg border text-xs font-bold text-center" value={item.inQty} onChange={e => handleInputChange(idx, 'inQty', Number(e.target.value))} />
                                                <button onClick={() => handleRemoveRow(idx)} className="text-red-500 font-bold text-sm px-1">×</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button onClick={handleConfirmInventory} disabled={isSubmitting} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-black text-sm shadow-md">
                                    {isSubmitting ? "입고 처리 중..." : "✅ 확인 및 재고 시트 입고 저장"}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<MiseOnApp />);
    </script>
</body>
</html>
