<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mise-On : Smart Kitchen System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
        #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .modal-view { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; padding: 15px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // 사진 링크 변환 (앱에서 보여주기 위함)
        const formatImageUrl = (url) => {
            if (!url) return "";
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            return match ? `https://drive.google.com/uc?export=view&id=${match[1]}` : url;
        };

        const App = () => {
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [activeReportTab, setActiveReportTab] = useState('아침');
            const [reportData, setReportData] = useState({ beforeImg: '', afterImg: '' });

            // 업로드 함수
            const upload = async (imageType, e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const base64 = event.target.result.split(',')[1];
                    const res = await fetch('<?= ScriptApp.getService().getUrl() ?>', {
                        method: 'POST',
                        body: JSON.stringify({ action: 'upload_report', date: selectedDate, reportType: activeReportTab, imageType, imageBase64: base64 })
                    });
                    const result = await res.json();
                    if (result.status === 'success') alert("저장 완료");
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="p-4">
                    <h2 className="text-xl font-bold mb-4">현장 보고 ({selectedDate})</h2>
                    <div className="flex gap-2 mb-4">
                        {['아침', '점심', '저녁'].map(t => <button className={activeReportTab === t ? "bg-blue-600 text-white px-4 py-2 rounded" : "bg-gray-200 px-4 py-2 rounded"} onClick={() => setActiveReportTab(t)}>{t}</button>)}
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <p>식전</p>
                            <input type="file" onChange={(e) => upload('before', e)} />
                            {reportData.beforeImg && <img src={formatImageUrl(reportData.beforeImg)} className="w-full" />}
                        </div>
                        <div>
                            <p>식후</p>
                            <input type="file" onChange={(e) => upload('after', e)} />
                            {reportData.afterImg && <img src={formatImageUrl(reportData.afterImg)} className="w-full" />}
                        </div>
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
