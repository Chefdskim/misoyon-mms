 <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mise-On : Smart Kitchen System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
        #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #cbd5e1; gap: 1px; border: 1px solid #cbd5e1; flex: 1; overflow-y: auto; grid-auto-rows: minmax(60px, 1fr); } 
        @media (min-width: 1024px) { .calendar-grid { grid-template-rows: 25px repeat(6, 1fr); grid-auto-rows: auto; } }
        .calendar-header { background: #f8fafc; text-align: center; font-size: 9px; font-weight: 900; color: #94a3b8; padding: 4px 0; }
        .calendar-day { background: white; padding: 2px 4px; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; min-height: 0; position: relative; }
        .calendar-day.selected { background: #eff6ff !important; box-shadow: inset 0 0 0 2px #3b82f6; z-index: 10; }
        .menu-text { font-size: 9px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; padding: 1px 2px; border-radius: 2px; }
        
        .modal-view { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; padding: 15px; animation: slideUp 0.3s ease-out; }
        .recipe-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .zoom-popup { position: fixed; inset: 0; background: rgba(255,255,255,0.98); z-index: 1500; display: flex; flex-direction: column; padding: 20px; animation: zoomIn 0.2s ease-out; }
        .recipe-tag { display: inline-block; background: #eff6ff; color: #2563eb; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-right: 4px; margin-top: 4px; border: 1px solid #bfdbfe; cursor: pointer; transition: all 0.2s; }
        .recipe-content { font-size: 13px; font-weight: 600; color: #1e293b; line-height: 1.7; white-space: pre-wrap; }
        .hl-red { color: #ef4444; text-decoration: underline; font-weight: 900; }
        
        .login-screen { position: fixed; inset: 0; background: #f8fafc; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 320px; text-align: center; }
        .login-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; transition: all 0.2s; font-weight: 700; }
        .login-btn { width: 100%; background: #3b82f6; color: white; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 14px; margin-top: 4px; }
        .login-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .imp-check { width: 18px; height: 18px; accent-color: #f59e0b; cursor: pointer; }
        .spin-anim { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbz_7KRW_j6AwOWZOdLhTxfeGSCD1gvuHlb0EKUbwPzstN-kHJDI7KB0Qmy_3h9sqmiZGw/exec";

        const DEFAULT_USERS = [
            { name: "관리자", code: "2026" }
        ];

        const getTodayStr = () => {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const normalizeDate = (dStr) => {
            if (!dStr) return "";
            const str = String(dStr).trim();
            let match = str.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) return `${match[1]}-${String(match[2]).padStart(2, '0')}-${String(match[3]).padStart(2, '0')}`;
            match = str.match(/(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) return `2026-${String(match[1]).padStart(2, '0')}-${String(match[3]).padStart(2, '0')}`;
            const digits = str.replace(/[^\d]/g, "");
            if (digits.length === 8) return `${digits.substring(0,4)}-${digits.substring(4,6)}-${digits.substring(6,8)}`;
            return str;
        };

        const compressImage = (file, maxWidth = 800, quality = 0.6) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
                    };
                    img.onerror = () => resolve(null);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        };

        const formatImageUrl = (url) => {
            if (!url) return "";
            const match1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            const match2 = url.match(/id=([a-zA-Z0-9_-]+)/);
            const fileId = match1 ? match1[1] : (match2 ? match2[1] : null);
            if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
            return url;
        };

        const autoClassifySection = (name) => {
            if (!name || !name.trim()) return "농산";
            const cleanNameStr = name.trim().toLowerCase();
            if (/돼지|소|고기|삼겹|목살|갈비|닭|오리|차돌|양지|등심|안심|돈육|우육|계육|족발|보쌈|베이컨|햄|소시지|한우/.test(cleanNameStr)) return "축산";
            if (/생선|고등어|갈치|오징어|문어|낙지|새우|굴|조개|전복|명태|동태|대구|멸치|다시마|미역|김|게|꽃게|골뱅이|홍합|가자미|광어|연어|바지락/.test(cleanNameStr)) return "수산";
            if (/간장|된장|고추장|식용유|참기름|굴소스|설탕|소금|미원|식초|당면|국수|파스타|통조림|두부|떡|튀김가루|부침가루|케찹|마요네즈|소스/.test(cleanNameStr)) return "가공";
            return "농산";
        };

        const cleanStr = (s) => {
            if (!s) return "";
            return String(s)
                .replace(/\([^)]*\)/g, "")
                .replace(/\[[^\]]*\]/g, "")
                .replace(/[^가-힣a-zA-Z0-9]/g, "")
                .toLowerCase();
        };

        const findMatchedRecipes = (menuText, recipeMap) => {
            if (!menuText || menuText === "일정없음" || !recipeMap) return [];
            const recipes = Object.values(recipeMap);
            if (recipes.length === 0) return [];

            const dishTokens = menuText.split(/[\/\n,\+&\|>:]+/).map(s => s.trim()).filter(Boolean);
            const matchedRecipes = [];

            dishTokens.forEach(dish => {
                const dishNorm = cleanStr(dish);
                if (!dishNorm) return;

                const exactMatch = recipes.find(recipe => {
                    if (!recipe) return false;
                    const keyNorm = cleanStr(recipe.key);
                    const nameNorm = cleanStr(recipe.name);
                    return (keyNorm && (dishNorm.includes(keyNorm) || keyNorm.includes(dishNorm))) || 
                           (nameNorm && (dishNorm.includes(nameNorm) || nameNorm.includes(dishNorm)));
                });

                if (exactMatch && !matchedRecipes.some(m => m.key === exactMatch.key)) {
                    matchedRecipes.push(exactMatch);
                }
            });

            return matchedRecipes;
        };

        const highlightText = (text, query) => {
            if (!query || !text || !isNaN(query)) return text;
            const parts = text.split(new RegExp(`(${query})`, 'gi'));
            return parts.map((p, i) => p.toLowerCase() === query.toLowerCase() ? <span key={i} className="hl-red">{p}</span> : p);
        };

        const MenuCard = ({text, type, query, recipeMap, setPopupRecipes, setActiveRecipeIndex, onExpand}) => {
            const matched = findMatchedRecipes(text, recipeMap);
            return (
                <div onClick={() => onExpand && onExpand(type, text)} className={`p-4 rounded-xl border mb-3 transition-all cursor-pointer ${matched.length > 0 ? 'bg-blue-50 border-blue-200 hover:bg-blue-100' : 'bg-slate-50 border-slate-100 hover:bg-slate-100'}`}>
                    <div className="text-[10px] font-black text-slate-400 uppercase mb-1 flex justify-between">
                        <span>{type}</span>
                        <span className="text-xs text-slate-300">🔍 확대</span>
                        {matched.length > 0 && <span className="text-blue-500 font-bold">📖 레시피 {matched.length}건</span>}
                    </div>
                    <div className="text-sm font-black text-slate-700 mb-2 leading-relaxed whitespace-pre-wrap">
                        {highlightText(text || "일정없음", query)}
                    </div>
                    {matched.length > 0 && (
                        <div className="flex flex-wrap gap-1 mt-2 pt-2 border-t border-blue-100">
                            {matched.map((r, idx) => (
                                <span key={idx} className="recipe-tag" onClick={(e) => { e.stopPropagation(); setPopupRecipes(matched); setActiveRecipeIndex(idx); }}>📖 {r.name || r.key}</span>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const WeeklyMenuRow = ({ label, colorClass, text, recipeMap, setPopupRecipes, setActiveRecipeIndex }) => {
            if(!text) return <div className="flex gap-2 text-sm"><span className={`w-8 font-bold ${colorClass}`}>{label}</span><span className="text-slate-300">-</span></div>;
            const matched = findMatchedRecipes(text, recipeMap);
            return (
                <div className="flex gap-2 text-sm items-start">
                    <span className={`w-12 font-bold ${colorClass} shrink-0`}>{label}</span>
                    <div className="flex-1">
                        <span className="font-bold text-slate-700">{text}</span>
                        {matched.length > 0 && (
                            <div className="flex flex-wrap gap-1 mt-1">
                                {matched.map((r, idx) => (
                                    <span key={idx} className="recipe-tag" onClick={(e) => { e.stopPropagation(); setPopupRecipes(matched); setActiveRecipeIndex(idx); }}>📖 {r.name || r.key}</span>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const MiseOnApp = () => {
            const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1ipSLhBGgAW1U_RF9Xkez3hUl_Eiklyor-OeQ-DtHV9o/edit?usp=sharing"; 
            const USER_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=1190342038&single=true&output=csv";
            const MENU_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=0&single=true&output=csv";
            const SEASONAL_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=1051704487&single=true&output=csv";
            const REPORT_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=949601099&single=true&output=csv";
            const COMMENT_READ_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=918283439&single=true&output=csv";
            const COMMENT_WRITE_URL = "https://script.google.com/macros/s/AKfycbxQt7hG7JaH3HBD0ygYNezSlNFEuqLZJAv-22gDCTMET7z2nZs_MarT47Rxq7GlxBxC-Q/exec";

            const [webAppUrl, setWebAppUrl] = useState(() => localStorage.getItem("misoyon_webapp_url") || DEFAULT_GAS_URL);
            const [urlSettingModal, setUrlSettingModal] = useState(false);
            const [inputUrl, setInputUrl] = useState(webAppUrl);

            const ADMIN_NAME = "관리자";
            const ADMIN_CODE = "2026";

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState("");
            const [inputName, setInputName] = useState("");
            const [inputCode, setInputCode] = useState("");
            const [loginError, setLoginError] = useState("");
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [userList, setUserList] = useState(DEFAULT_USERS);
            
            const [menus, setMenus] = useState([]);
            const [selectedDate, setSelectedDate] = useState(null);
            const [recipeMap, setRecipeMap] = useState({});

            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState("");
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [currentMonth, setCurrentMonth] = useState(new Date());

            const [searchTerm, setSearchTerm] = useState("");
            const [modalSearch, setModalSearch] = useState("");
            const [activeModal, setActiveModal] = useState(false);

            const [weeklyModal, setWeeklyModal] = useState(false);
            const [importantModal, setImportantModal] = useState(false);

            const [popupRecipes, setPopupRecipes] = useState([]);
            const [activeRecipeIndex, setActiveRecipeIndex] = useState(0);
            const [expandedMenu, setExpandedMenu] = useState(null);

            const [seasonalModal, setSeasonalModal] = useState(false);
            const [seasonalData, setSeasonalData] = useState([]);

            const [reports, setReports] = useState([]);
            const [reportModal, setReportModal] = useState(false);
            const [activeReportTab, setActiveReportTab] = useState('아침');
            const [isUploadingReport, setIsUploadingReport] = useState(null);

            const [inventoryModal, setInventoryModal] = useState(false);
            const [activeInvTab, setActiveInvTab] = useState("summary");
            const [historyFilter, setHistoryFilter] = useState("all");
            const [showZeroStock, setShowZeroStock] = useState(false);

            const [inventoryList, setInventoryList] = useState([]);
            const [receiptList, setReceiptList] = useState([]);
            const [isUploading, setIsUploading] = useState(false);
            const [isLoadingInv, setIsLoadingInv] = useState(false);

            const [inputItems, setInputItems] = useState([
                { section: "농산", name: "", inQty: "1", unit: "kg", price: 0 }
            ]);

            useEffect(() => {
                Papa.parse(`${USER_URL}&t=${new Date().getTime()}`, {
                    download: true, header: false,
                    complete: (res) => {
                        const users = [];
                        if (res?.data) {
                            res.data.forEach(row => { 
                                if (row.length >= 2 && row[1]) {
                                    users.push({ name: (row[0]||"").trim(), code: (row[1]||"").trim() });
                                }
                            });
                        }
                        if (users.length > 0) setUserList(users);
                    }
                });
            }, []);

            const saveWebAppUrl = () => {
                if (!inputUrl.trim()) return alert("URL을 입력해 주세요.");
                localStorage.setItem("misoyon_webapp_url", inputUrl.trim());
                setWebAppUrl(inputUrl.trim());
                setUrlSettingModal(false);
                alert("웹앱 URL 연결 저장 완료!");
            };

            const fetchInventoryData = () => {
                if (!webAppUrl) return;
                setIsLoadingInv(true);
                const separator = webAppUrl.includes('?') ? '&' : '?';
                fetch(`${webAppUrl}${separator}mode=inventory&t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(data => {
                    setIsLoadingInv(false);
                    if (data.inventory) setInventoryList(data.inventory);
                    if (data.receipts) setReceiptList(data.receipts);
                    if (data.recipesFromSheet && data.recipesFromSheet.length > 0) {
                        const newMap = {};
                        data.recipesFromSheet.forEach(r => {
                            if (r.key) newMap[r.key] = r;
                            if (r.name && r.name !== r.key) newMap[r.name] = r;
                        });
                        setRecipeMap(newMap);
                    }
                })
                .catch(() => setIsLoadingInv(false));
            };

            const fetchData = (forceFresh = false) => {
                if(forceFresh) setIsRefreshing(true);
                const getUrl = (url) => forceFresh ? `${url}&t=${new Date().getTime()}` : url;

                Papa.parse(getUrl(USER_URL), { 
                    download: true, header: false,
                    complete: (res) => {
                        const users = [];
                        if (res?.data) res.data.forEach(row => { if (row.length >= 2 && row[1]) users.push({ name: (row[0]||"").trim(), code: (row[1]||"").trim() }); });
                        if (users.length > 0) setUserList(users);
                    }
                });

                Papa.parse(getUrl(MENU_URL), { 
                    download: true, 
                    complete: (res) => {
                        let temp = []; let headers = [];
                        if (res?.data) {
                            res.data.forEach(row => {
                                const label = (row[0] || "").replace(/\s/g, "");
                                const vals = row.slice(1);
                                if (label === "날짜") {
                                    headers = vals.map(v => normalizeDate(v));
                                    headers.forEach(d => { if(d) temp.push({ date: d, morning: "", lunch: "", dinner: "", duty: "", packing: "" }); });
                                } else if (headers.length > 0) {
                                    vals.forEach((v, i) => {
                                        if (!headers[i]) return;
                                        const t = temp.find(m => m.date === headers[i]);
                                        if (t && v && String(v).trim() !== "") {
                                            if (label.includes("아침")) t.morning = v;
                                            else if (label.includes("점심")) t.lunch = v;
                                            else if (label.includes("저녁")) t.dinner = v;
                                            else if (label.includes("근무") || label.includes("당직")) t.duty = t.duty ? t.duty + " / " + v : v;
                                            else if (label.includes("포장") || label.includes("Takeout") || label.includes("테이크아웃")) t.packing = v;
                                        }
                                    });
                                }
                            });
                        }
                        setMenus(temp);
                        const todayStr = getTodayStr();
                        setSelectedDate(temp.find(m => m.date === todayStr) || { date: todayStr, morning: "", lunch: "", dinner: "", duty: "", packing: "" });
                    }
                });

                Papa.parse(getUrl(SEASONAL_URL), {
                    download: true, complete: (res) => {
                        const data = [];
                        if (res?.data) {
                            res.data.forEach(row => {
                                const monthStr = row[0] ? row[0].toString().replace(/[^0-9]/g, '') : '';
                                const m = parseInt(monthStr);
                                if(row.length >= 3 && !isNaN(m) && m >= 1 && m <= 12) {
                                    const rowString = row.join(" ");
                                    let foundImage = "";
                                    const urlMatch = rowString.match(/(https?:\/\/[^\s,]+)/);
                                    if(urlMatch) { foundImage = urlMatch[0].trim().replace(/["']$/, ""); }
                                    data.push({
                                        month: m, category: row[1]?.trim() || "기타",
                                        name: row[2]?.trim() || "", desc: row[3]?.trim() || "",
                                        pairing: row[4]?.trim() || "", menu: row[5]?.trim() || "",
                                        image: foundImage
                                    });
                                }
                            });
                        }
                        setSeasonalData(data);
                    }
                });

                // 📌 중복 저장된 현장보고서 행 자동 병합 파싱
                Papa.parse(getUrl(REPORT_URL), {
                    download: true, complete: (res) => {
                        const reportMap = {};
                        if (res?.data) {
                            res.data.forEach(row => {
                                if(row.length >= 4 && row[0] !== "날짜") {
                                    const d = normalizeDate(row[0]);
                                    const t = row[1]?.trim() || "아침";
                                    const key = `${d}_${t}`;
                                    if (!reportMap[key]) {
                                        reportMap[key] = { date: d, type: t, beforeImg: "", afterImg: "", content: "", author: "" };
                                    }
                                    if (row[2]?.trim()) reportMap[key].beforeImg = row[2].trim();
                                    if (row[3]?.trim()) reportMap[key].afterImg = row[3].trim();
                                    if (row[4]?.trim()) reportMap[key].content = row[4].trim();
                                    if (row[5]?.trim()) reportMap[key].author = row[5].trim();
                                }
                            });
                        }
                        setReports(Object.values(reportMap));
                    }
                });

                Papa.parse(getUrl(COMMENT_READ_URL), {
                    download: true, complete: (res) => {
                        const loadedComments = [];
                        if (res?.data) {
                            res.data.forEach(row => {
                                if(row.length >= 4 && row[0] !== "날짜") {
                                    const isImportant = row[4] && row[4].trim() !== "";
                                    loadedComments.push({
                                        date: normalizeDate(row[0]), name: row[1], content: row[2], time: row[3], important: isImportant
                                    });
                                }
                            });
                        }
                        loadedComments.sort((a,b) => new Date(b.date) - new Date(a.date));
                        setComments(loadedComments);
                        if(forceFresh) setTimeout(() => setIsRefreshing(false), 500);
                    }
                });

                fetchInventoryData();
            };

            useEffect(() => { if (isAuthenticated) fetchData(); }, [isAuthenticated, webAppUrl]);
            useEffect(() => { const saved = localStorage.getItem("misoyon_user"); if (saved) { setIsAuthenticated(true); setCurrentUser(saved); } }, []);

            const handleLogin = () => {
                const name = inputName.trim();
                const code = inputCode.trim();

                if (!name || !code) {
                    setLoginError("이름과 코드를 입력하세요.");
                    return;
                }

                const foundLocal = userList.find(u => u.name === name && u.code === code);
                if (foundLocal) {
                    setIsAuthenticated(true);
                    setCurrentUser(foundLocal.name);
                    localStorage.setItem("misoyon_user", foundLocal.name);
                    setLoginError("");
                    return;
                }

                if (name === ADMIN_NAME && code === ADMIN_CODE) {
                    setIsAuthenticated(true);
                    setCurrentUser("관리자");
                    localStorage.setItem("misoyon_user", "관리자");
                    setLoginError("");
                    return;
                }

                setIsLoggingIn(true);
                setLoginError("구글 시트에서 사용자 정보를 확인하는 중...");

                Papa.parse(`${USER_URL}&t=${new Date().getTime()}`, {
                    download: true, header: false,
                    complete: (res) => {
                        setIsLoggingIn(false);
                        const freshUsers = [];
                        if (res?.data) {
                            res.data.forEach(row => {
                                if (row.length >= 2 && row[1]) {
                                    freshUsers.push({ name: (row[0]||"").trim(), code: (row[1]||"").trim() });
                                }
                            });
                        }
                        if (freshUsers.length > 0) setUserList(freshUsers);

                        const foundFresh = freshUsers.find(u => u.name === name && u.code === code);
                        if (foundFresh) {
                            setIsAuthenticated(true);
                            setCurrentUser(foundFresh.name);
                            localStorage.setItem("misoyon_user", foundFresh.name);
                            setLoginError("");
                        } else {
                            setLoginError("이름 또는 코드를 확인하세요.");
                        }
                    },
                    error: () => {
                        setIsLoggingIn(false);
                        setLoginError("사용자 목록을 불러오는 중 오류가 발생했습니다.");
                    }
                });
            };

            const handleLogout = () => { setIsAuthenticated(false); setCurrentUser(""); localStorage.removeItem("misoyon_user"); window.location.reload(); };

            const submitIngredients = (imageBase64Data = null) => {
                if (!webAppUrl) return alert("URL 연결 설정을 확인해 주세요.");
                
                const validItems = inputItems.filter(item => item.name.trim() !== "").map(item => ({
                    ...item,
                    inQty: parseFloat(item.inQty) || 0,
                    price: parseFloat(item.price) || 0
                }));
                
                if (validItems.length === 0 && !imageBase64Data) {
                    return alert("등록할 식재료 품목명을 입력하거나 명세서 사진을 찍어주세요.");
                }

                setIsUploading(true);
                fetch(webAppUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'upload_inventory',
                        imageBase64: imageBase64Data || "",
                        items: validItems
                    })
                })
                .then(res => res.json())
                .then(resData => {
                    setIsUploading(false);
                    if (resData.status === 'success') {
                        alert("구글 드라이브 및 시트 등록 완료!");
                        setInputItems([{ section: "농산", name: "", inQty: "1", unit: "kg", price: 0 }]);
                        fetchInventoryData();
                    } else {
                        alert("저장 실패: " + (resData.message || "오류"));
                    }
                })
                .catch(() => {
                    setIsUploading(false);
                    alert("전송 중 네트워크 오류 발생");
                });
            };

            const handlePhotoAndSave = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const base64Data = await compressImage(file, 800, 0.6);
                    submitIngredients(base64Data);
                    e.target.value = "";
                } catch(err) { e.target.value = ""; }
            };

            // 📌 사진 업로드 시 앱 상에 즉시 반영 로직 추가
            const handleReportPhotoUpload = async (mealType, imageType, e) => {
                const file = e.target.files[0];
                if (!file || !selectedDate) return;
                setIsUploadingReport(imageType);

                try {
                    const base64 = await compressImage(file, 800, 0.6);
                    fetch(webAppUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'upload_report',
                            date: selectedDate.date,
                            reportType: mealType,
                            imageType: imageType,
                            imageBase64: base64,
                            author: currentUser
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        setIsUploadingReport(null);
                        e.target.value = "";
                        if (data.status === 'success') {
                            alert("현장 사진이 구글 드라이브 및 시트에 저장되었습니다!");
                            
                            // 🌟 앱 상의 상태 즉시 업데이트 (게시 지연 방지)
                            if (data.photoUrl) {
                                setReports(prev => {
                                    const next = [...prev];
                                    const idx = next.findIndex(r => r.date === selectedDate.date && r.type === mealType);
                                    if (idx >= 0) {
                                        next[idx] = {
                                            ...next[idx],
                                            [imageType === 'before' ? 'beforeImg' : 'afterImg']: data.photoUrl,
                                            author: currentUser
                                        };
                                    } else {
                                        next.push({
                                            date: selectedDate.date,
                                            type: mealType,
                                            beforeImg: imageType === 'before' ? data.photoUrl : '',
                                            afterImg: imageType === 'after' ? data.photoUrl : '',
                                            content: '',
                                            author: currentUser
                                        });
                                    }
                                    return next;
                                });
                            }
                            fetchData(true);
                        } else alert("등록 실패: " + (data.message || "오류"));
                    })
                    .catch(() => {
                        setIsUploadingReport(null);
                        e.target.value = "";
                        alert("전송 중 오류 발생");
                    });
                } catch (err) { 
                    setIsUploadingReport(null); 
                    e.target.value = "";
                }
            };

            const handleManualQtyUpdate = (item) => {
                const newQtyStr = prompt(`[${item.name}] 변경할 재고 수량을 입력하세요 (현재: ${item.invQty}${item.unit}):`, item.invQty);
                if (newQtyStr === null) return;
                const newQty = parseFloat(newQtyStr);
                if (isNaN(newQty)) return alert("숫자만 입력 가능합니다.");

                fetch(webAppUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'update_inventory_manual',
                        rowIdx: item.rowIdx,
                        newInvQty: newQty
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert("재고 수량이 수정되었습니다.");
                        fetchInventoryData();
                    } else alert("수정 실패");
                });
            };

            const handleTriggerAutoDeduct = () => {
                if (!confirm("오늘 메뉴(아침, 점심, 저녁, 포장 포함) 소요량에 평균 로스율 12%를 가산하여 즉시 차감하시겠습니까?")) return;
                fetch(webAppUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'trigger_auto_deduct' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert("오늘 메뉴 식재료 및 포장재 차감이 로스율(12%) 포함하여 반영되었습니다.");
                        fetchInventoryData();
                    } else alert("차감 실패: " + (data.message || "오류"));
                });
            };

            const handleCommentSubmit = () => {
                if (!newComment.trim() || !selectedDate) return;
                setIsSubmitting(true);
                const prefix = reportModal ? `[보고서/${activeReportTab}] ` : "";
                const commentData = { date: selectedDate.date, name: currentUser, content: prefix + newComment.trim(), action: 'write' };
                fetch(COMMENT_WRITE_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(commentData) })
                .then(() => {
                    setComments([{ ...commentData, time: new Date().toLocaleString("ko-KR"), important: false }, ...comments]);
                    setNewComment("");
                    setIsSubmitting(false);
                })
                .catch(() => {
                    alert("전송 실패.");
                    setIsSubmitting(false);
                });
            };

            const handleToggleImportant = (targetComment) => {
                if (currentUser !== ADMIN_NAME) return;
                const updatedComments = comments.map(c => c === targetComment ? { ...c, important: !c.important } : c);
                setComments(updatedComments);
                fetch(COMMENT_WRITE_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'toggle', date: targetComment.date, name: targetComment.name, content: targetComment.content }) });
            };

            const handleAddRow = () => setInputItems([...inputItems, { section: "농산", name: "", inQty: "1", unit: "kg", price: 0 }]);
            const handleRemoveRow = (index) => setInputItems(inputItems.filter((_, idx) => idx !== index));
            
            const handleInputChange = (index, field, value) => {
                const updated = [...inputItems];
                updated[index][field] = value;
                if (field === 'name') {
                    updated[index].section = autoClassifySection(value);
                }
                setInputItems(updated);
            };

            const handleExpandMenu = (type, text) => {
                if(!text) return;
                setExpandedMenu({ type, text });
            };

            const getWeeklyData = () => {
                if (!selectedDate || !selectedDate.date) return [];
                try {
                    const [y, m, d] = selectedDate.date.split('-').map(Number);
                    const target = new Date(y, m - 1, d);
                    const day = target.getDay();
                    const weekData = [];
                    for(let i=0; i<7; i++) {
                        const tempDate = new Date(y, m - 1, d - day + i);
                        const dateStr = normalizeDate(`${tempDate.getFullYear()}-${String(tempDate.getMonth() + 1).padStart(2, '0')}-${String(tempDate.getDate()).padStart(2, '0')}`);
                        const menu = menus.find(m => m.date === dateStr);
                        weekData.push({ date: dateStr, dayIdx: i, menu: menu });
                    }
                    return weekData;
                } catch (e) { return []; }
            };

            const calDays = useMemo(() => {
                const year = currentMonth.getFullYear(), month = currentMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const lastDate = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= lastDate; i++) {
                    const ds = normalizeDate(`${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
                    days.push({ day: i, dateStr: ds, data: menus.find(m => m.date === ds) });
                }
                while (days.length < 42) days.push(null);
                return days;
            }, [currentMonth, menus]);

            const currentSearchResults = useMemo(() => {
                const q = (activeModal ? modalSearch : searchTerm).trim();
                if (!q) return [];
                const query = q.toLowerCase().replace(/\s+/g, "");
                const isMonthSearch = q.endsWith("월") || (!isNaN(q) && parseInt(q) <= 12);
                return menus.filter(m => {
                    if (isMonthSearch) return String(new Date(m.date).getMonth() + 1).padStart(2, '0') === q.replace("월","").padStart(2,'0');
                    return (m.morning + m.lunch + m.dinner + (m.duty||"") + (m.packing||"")).toLowerCase().replace(/\s+/g, "").includes(query);
                }).sort((a,b) => new Date(b.date) - new Date(a.date));
            }, [modalSearch, searchTerm, activeModal, menus]);

            const groupedSeasonal = useMemo(() => {
                const thisMonth = currentMonth.getMonth() + 1;
                const thisMonthData = seasonalData.filter(d => d.month === thisMonth);
                return thisMonthData.reduce((acc, item) => {
                    const cat = item.category || '기타';
                    if(!acc[cat]) acc[cat] = [];
                    acc[cat].push(item);
                    return acc;
                }, {});
            }, [seasonalData, currentMonth]);

            const importantComments = comments.filter(c => c.important);
            const weekDays = ['일','월','화','수','목','금','토'];
            const yearOptions = Array.from({length: 16}, (_, i) => 2020 + i);
            const currentRecipe = popupRecipes[activeRecipeIndex];
            const weeklyData = getWeeklyData();
            const todayComments = selectedDate ? comments.filter(c => c.date === selectedDate.date) : [];
            const todayReports = selectedDate ? reports.filter(r => r.date === selectedDate.date) : [];

            const todayRecipes = useMemo(() => {
                if (!selectedDate) return [];
                const combinedText = `${selectedDate.morning || ""} ${selectedDate.lunch || ""} ${selectedDate.dinner || ""} ${selectedDate.packing || ""}`;
                return findMatchedRecipes(combinedText, recipeMap);
            }, [selectedDate, recipeMap]);

            const summaryInventory = useMemo(() => {
                const map = {};
                inventoryList.forEach(item => {
                    const nameKey = (item.name || "").trim();
                    if (!nameKey) return;
                    if (!map[nameKey]) {
                        map[nameKey] = {
                            section: item.section || "기타",
                            name: nameKey,
                            unit: item.unit || "kg",
                            totalInQty: 0,
                            totalInvQty: 0,
                            totalInvAmount: 0,
                            lastDate: item.date,
                            latestRowIdx: item.rowIdx
                        };
                    }
                    map[nameKey].totalInQty += (Number(item.inQty) || 0);
                    map[nameKey].totalInvQty += (Number(item.invQty) || 0);
                    map[nameKey].totalInvAmount += (Number(item.invAmount) || 0);
                    if (item.date > map[nameKey].lastDate) {
                        map[nameKey].lastDate = item.date;
                        map[nameKey].latestRowIdx = item.rowIdx;
                    }
                });
                let result = Object.values(map);
                if (!showZeroStock) {
                    result = result.filter(i => i.totalInvQty > 0);
                }
                return result;
            }, [inventoryList, showZeroStock]);

            const filteredHistoryList = useMemo(() => {
                if (historyFilter === "all") return inventoryList;
                const todayStr = getTodayStr();
                const now = new Date();
                
                return inventoryList.filter(item => {
                    const dStr = normalizeDate(item.date);
                    if (historyFilter === "today") return dStr === todayStr;
                    
                    const itemDate = new Date(dStr);
                    if (isNaN(itemDate.getTime())) return false;

                    if (historyFilter === "week") {
                        const diffTime = Math.abs(now - itemDate);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        return diffDays <= 7;
                    }
                    if (historyFilter === "month") {
                        return itemDate.getFullYear() === now.getFullYear() && itemDate.getMonth() === now.getMonth();
                    }
                    return true;
                });
            }, [inventoryList, historyFilter]);

            if (!isAuthenticated) {
                return (
                    <div className="login-screen">
                        <div className="login-box">
                            <h1 className="text-3xl font-black italic tracking-tighter mb-2">Mise-On</h1>
                            <p className="text-xs text-blue-600 font-bold mb-1 uppercase tracking-widest">Digital Mise-en-place</p>
                            <p className="text-[10px] text-slate-400 font-bold mb-6">Powered by Chef D.S. Kim</p>
                            <input type="text" className="login-input" placeholder="이름 (Name)" value={inputName} onChange={e => setInputName(e.target.value)} />
                            <input type="password" inputMode="numeric" className="login-input" placeholder="비밀번호 (Code)" value={inputCode} onChange={e => setInputCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} disabled={isLoggingIn} className="login-btn">
                                {isLoggingIn ? "검증 중..." : "LOGIN"}
                            </button>
                            {loginError && <p className="text-red-500 text-xs font-bold mt-3">{loginError}</p>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full w-full">
                    <header className="flex flex-col px-4 py-3 bg-white border-b gap-3 shrink-0">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-black italic tracking-tighter">Mise-On <span className="text-blue-600 text-xs not-italic">v3.5</span></h1>
                                <div className="text-[10px] text-slate-400 font-bold">Smart Kitchen System</div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => { setInventoryModal(true); fetchInventoryData(); }} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-black text-xs shadow-sm hover:bg-emerald-700">📦 입고 및 재고 관리</button>
                                
                                {currentUser === ADMIN_NAME && (
                                    <>
                                        <button onClick={() => setUrlSettingModal(true)} className="bg-amber-500 text-white px-3 py-1.5 rounded-xl font-black text-xs shadow-sm">⚙️ URL 연결</button>
                                        <a href={SHEET_EDIT_URL} target="_blank" rel="noopener noreferrer" className="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl border border-indigo-200 font-black text-xs no-underline">📊 원본 시트</a>
                                    </>
                                )}

                                <button onClick={handleLogout} className="bg-red-500 text-white px-3 py-1.5 rounded-xl font-black text-xs">OUT</button>
                            </div>
                        </div>

                        <div className="flex gap-2">
                            <div className="flex-1 flex items-center justify-center bg-slate-100 px-3 py-2 rounded-xl border font-bold text-sm">
                                <select className="bg-transparent" value={currentMonth.getFullYear()} onChange={(e)=>setCurrentMonth(new Date(e.target.value, currentMonth.getMonth()))}>{yearOptions.map(y => <option key={y} value={y}>{y}년</option>)}</select>
                                <span className="mx-1">/</span>
                                <select className="bg-transparent" value={currentMonth.getMonth() + 1} onChange={(e)=>setCurrentMonth(new Date(currentMonth.getFullYear(), e.target.value - 1))}>{Array.from({length:12},(_,i)=>i+1).map(m => <option key={m} value={m}>{m}월</option>)}</select>
                            </div>
                            <button onClick={() => fetchData(true)} className="bg-slate-800 text-white px-3 py-2 rounded-xl font-black text-xs flex items-center gap-1">
                                <span className={isRefreshing ? "spin-anim" : ""}>🔄</span> <span>{isRefreshing ? "갱신중" : "갱신"}</span>
                            </button>
                        </div>

                        <div className="flex gap-2">
                            <input className="flex-1 bg-slate-100 px-3 py-2 rounded-xl text-xs font-bold border outline-none" placeholder="검색어를 입력하세요 (예: 제육, 1월)" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} onKeyDown={e=>e.key==='Enter' && (setModalSearch(searchTerm), setActiveModal(true))}/>
                            <button onClick={()=>{setModalSearch(searchTerm); setActiveModal(true);}} className="bg-blue-600 text-white px-4 py-2 rounded-xl font-black text-xs">GO</button>
                        </div>
                    </header>

                    <main className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                        <div className="flex-[2] flex flex-col min-h-[55%] lg:min-h-full border-b lg:border-b-0 lg:border-r overflow-hidden">
                            <div className="calendar-grid">
                                {weekDays.map(d=><div key={d} className="calendar-header">{d}</div>)}
                                {calDays.map((d,i)=>(
                                    <div key={i} className={`calendar-day ${d?.dateStr === selectedDate?.date ? 'selected' : ''}`} onClick={()=>d?.data && setSelectedDate(d.data)}>
                                        {d && (<><span className={`text-[10px] font-black ${d.data ? 'text-slate-800' : 'text-slate-300'}`}>{d.day}</span>
                                        {d.data && (<div className="flex flex-col gap-[1px] mt-[1px]">
                                            {d.data.morning && <div className="menu-text bg-orange-50 text-orange-600">조:{d.data.morning}</div>}
                                            {d.data.lunch && <div className="menu-text bg-blue-50 text-blue-600">중:{d.data.lunch}</div>}
                                            {d.data.dinner && <div className="menu-text bg-purple-50 text-purple-600">석:{d.data.dinner}</div>}
                                            {d.data.packing && <div className="menu-text bg-green-50 text-green-700">포:{d.data.packing}</div>}
                                        </div>)}</>)}
                                    </div>
                                ))}
                            </div>
                            <div className="p-2 bg-white border-t space-y-2">
                                <button onClick={()=>setSeasonalModal(true)} className="w-full bg-green-500 text-white py-3 rounded-xl font-black text-sm shadow-sm hover:bg-green-600 transition-colors flex items-center justify-center gap-2">
                                    <span>🌿 {currentMonth.getMonth()+1}월의 제철 식재료</span>
                                    {Object.keys(groupedSeasonal).length > 0 && <span className="bg-white text-green-700 text-xs px-2 py-0.5 rounded-full">{Object.values(groupedSeasonal).flat().length}</span>}
                                </button>
                                <button onClick={()=>setImportantModal(true)} className="w-full bg-yellow-400 text-yellow-900 py-3 rounded-xl font-black text-sm shadow-sm hover:bg-yellow-500 transition-colors flex items-center justify-center gap-2">
                                    <span>⭐ 중요 리뷰 모아보기</span><span className="bg-white text-yellow-800 text-xs px-2 py-0.5 rounded-full">{importantComments.length}</span>
                                </button>
                            </div>
                        </div>

                        <aside className="flex-1 bg-white p-4 overflow-y-auto min-h-[45%]">
                            {selectedDate ? (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center border-b-2 border-blue-600 pb-1">
                                        <h2 className="text-xl font-black italic">DAILY MENU</h2>
                                        <button onClick={()=>setWeeklyModal(true)} className="bg-slate-800 text-white px-3 py-1 rounded-lg text-xs font-bold shadow-lg hover:bg-slate-700 transition-all">📅 주간표 보기</button>
                                    </div>
                                    <div className="font-bold text-slate-500 text-sm mb-2">{selectedDate.date}</div>

                                    <button onClick={() => {setReportModal(true); setActiveReportTab('아침');}} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-black text-sm shadow-md hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2 mb-3">
                                        <span>📷 현장 보고서 확인 및 촬영 ({todayReports.length}건)</span>
                                    </button>

                                    {selectedDate.duty && <div className="p-4 rounded-xl border mb-3 bg-slate-50 border-slate-200"><div className="text-[10px] font-black text-slate-400 uppercase mb-1">Schedule</div><div className="text-sm font-black text-slate-800">👨‍🍳 {selectedDate.duty}</div></div>}
                                    
                                    <MenuCard text={selectedDate.morning} type="Morning" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} onExpand={handleExpandMenu} />
                                    <MenuCard text={selectedDate.lunch} type="Lunch" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} onExpand={handleExpandMenu} />
                                    <MenuCard text={selectedDate.dinner} type="Dinner" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} onExpand={handleExpandMenu} />
                                    
                                    {selectedDate.packing && <MenuCard text={selectedDate.packing} type="Takeout (포장)" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} onExpand={handleExpandMenu} />}
