                                        <h3 className="text-sm font-black text-slate-400 uppercase mb-3">💬 오늘의 한마디</h3>
                                        <div className="space-y-3 mb-4">
                                            {todayComments.length > 0 ? todayComments.map((c, i) => (
                                                <div key={i} className={`p-3 rounded-xl border transition-all ${c.important ? 'bg-yellow-50 border-yellow-200 ring-2 ring-yellow-100' : 'bg-slate-50'}`}>
                                                    <div className="flex justify-between items-center mb-1">
                                                        <div className="flex items-center gap-1">
                                                            {currentUser === ADMIN_NAME && <input type="checkbox" className="imp-check mr-1" checked={c.important} onChange={()=>handleToggleImportant(c)} />}
                                                            {c.important && <span className="text-xs">⭐</span>}
                                                            <span className={`text-xs font-black ${c.important ? 'text-yellow-700' : 'text-blue-600'}`}>{c.name}</span>
                                                        </div>
                                                        <span className="text-[10px] text-slate-400">{c.time}</span>
                                                    </div>
                                                    <div className={`text-xs font-bold whitespace-pre-wrap ${c.important ? 'text-slate-800' : 'text-slate-700'}`}>{c.content}</div>
                                                </div>
                                            )) : <div className="text-center text-xs text-slate-300 py-2">아직 댓글이 없습니다.</div>}
                                        </div>
                                        <div className="flex gap-2">
                                            <input className="flex-1 bg-slate-100 px-3 py-2 rounded-xl text-xs font-bold outline-none border focus:border-blue-500" placeholder="메세지를 입력하세요..." value={newComment} onChange={e=>setNewComment(e.target.value)} onKeyDown={e=>e.key==='Enter' && handleCommentSubmit()} disabled={isSubmitting}/>
                                            <button onClick={handleCommentSubmit} disabled={isSubmitting} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-black hover:bg-slate-700 disabled:opacity-50">{isSubmitting ? "..." : "전송"}</button>
                                        </div>
                                    </div>
                                </div>
                            ) : <div className="h-full flex items-center justify-center text-slate-300 font-black">SELECT DATE</div>}
                        </aside>
                    </main>

                    {/* ⚙️ URL 설정 모달 */}
                    {urlSettingModal && (
                        <div className="recipe-popup" onClick={() => setUrlSettingModal(false)}>
                            <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h3 className="text-lg font-black text-slate-800">⚙️ 웹앱 URL 설정</h3>
                                    <button onClick={() => setUrlSettingModal(false)} className="text-2xl font-bold text-slate-400">×</button>
                                </div>
                                <p className="text-xs text-slate-500 font-bold mb-3">구글 앱스 스크립트(GAS) Web App URL을 입력하세요.</p>
                                <input type="text" className="w-full p-3 border-2 border-amber-400 rounded-xl text-xs font-bold mb-4 outline-none" value={inputUrl} onChange={e => setInputUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" />
                                <button onClick={saveWebAppUrl} className="w-full bg-amber-500 text-white py-3 rounded-xl font-black text-xs shadow-md hover:bg-amber-600">저장하기</button>
                            </div>
                        </div>
                    )}

                    {/* 📦 식재료 및 재고 관리 모달 */}
                    {inventoryModal && (
                        <div className="modal-view bg-slate-100 overflow-y-auto">
                            <div className="flex justify-between items-center mb-3 bg-white p-4 rounded-2xl border shadow-sm shrink-0">
                                <div>
                                    <h2 className="text-lg font-black text-emerald-700 italic">📦 입고 및 재고 관리</h2>
                                    <p className="text-[10px] font-bold text-slate-400">매일 아침 09:00에 포장 포함 당일 레시피 소요량(로스율 12% 가산)이 시트에 자동 차감됩니다.</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={handleTriggerAutoDeduct} className="bg-blue-600 text-white px-2.5 py-1.5 rounded-xl text-xs font-black hover:bg-blue-700 shadow-sm">⚡ 오늘 메뉴 차감(포장포함/로스12%) 즉시 실행</button>
                                    <button onClick={fetchInventoryData} className="bg-slate-800 text-white px-2.5 py-1.5 rounded-xl text-xs font-black">🔄 새로고침</button>
                                    <button onClick={() => setInventoryModal(false)} className="text-2xl font-bold text-slate-400 px-2">×</button>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-2xl border shadow-sm mb-4 space-y-3 shrink-0">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <span className="text-xs font-black text-slate-700">식재료 입고 품목 입력</span>
                                    <button onClick={handleAddRow} className="bg-slate-800 text-white px-2.5 py-1 rounded-lg text-xs font-black">+ 품목 추가</button>
                                </div>
                                
                                <div className="space-y-3 p-1">
                                    {inputItems.map((item, idx) => (
                                        <div key={idx} className="flex gap-1.5 items-center bg-slate-50 p-2.5 rounded-xl border relative z-10">
                                            <div className="w-16 px-1 py-1.5 rounded-lg border text-xs font-black text-center bg-emerald-50 text-emerald-700 border-emerald-200 shrink-0">
                                                {item.section || "농산"}
                                            </div>

                                            <div className="relative flex-1">
                                                <input 
                                                    type="text"
                                                    className="w-full px-2.5 py-1.5 rounded-lg border text-xs font-bold outline-none focus:border-emerald-500 bg-white" 
                                                    placeholder="품목명 입력" 
                                                    value={item.name} 
                                                    onChange={e => handleInputChange(idx, 'name', e.target.value)} 
                                                />
                                            </div>

                                            <input 
                                                type="number" 
                                                step="0.1"
                                                min="0"
                                                className="w-16 px-1 py-1.5 rounded-lg border text-xs font-bold text-center outline-none bg-white focus:border-emerald-500" 
                                                placeholder="수량" 
                                                value={item.inQty} 
                                                onChange={e => handleInputChange(idx, 'inQty', e.target.value)} 
                                            />
                                            
                                            <select 
                                                className="w-16 px-1 py-1.5 rounded-lg border text-xs font-bold outline-none bg-white text-center"
                                                value={item.unit} 
                                                onChange={e => handleInputChange(idx, 'unit', e.target.value)}
                                            >
                                                <option value="kg">kg</option>
                                                <option value="g">g</option>
                                                <option value="L">L</option>
                                                <option value="ml">ml</option>
                                                <option value="개">개</option>
                                                <option value="봉">봉</option>
                                                <option value="판">판</option>
                                                <option value="박스">박스</option>
                                                <option value="마리">마리</option>
                                            </select>

                                            <input 
                                                type="number" 
                                                className="w-20 px-1 py-1.5 rounded-lg border text-xs font-bold text-right outline-none bg-white focus:border-emerald-500" 
                                                placeholder="단가" 
                                                value={item.price} 
                                                onChange={e => handleInputChange(idx, 'price', e.target.value)} 
                                            />

                                            <button onClick={() => handleRemoveRow(idx)} className="text-red-500 font-bold px-1 text-sm">×</button>
                                        </div>
                                    ))}
                                </div>

                                <div className="flex gap-2 pt-1">
                                    <button onClick={() => submitIngredients(null)} disabled={isUploading} className="flex-1 bg-emerald-600 text-white text-center py-3 rounded-xl font-black text-xs shadow-md hover:bg-emerald-700 disabled:opacity-50">
                                        {isUploading ? "등록 중..." : "➕ 식재료 텍스트 등록"}
                                    </button>
                                    <label className="flex-1 bg-indigo-600 text-white text-center py-3 rounded-xl font-black text-xs cursor-pointer shadow-md hover:bg-indigo-700 flex items-center justify-center gap-1">
                                        <span>📷 {isUploading ? "드라이브 저장 중..." : "명세서 촬영 (드라이브 자동저장)"}</span>
                                        <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhotoAndSave} disabled={isUploading} />
                                    </label>
                                </div>
                            </div>

                            <div className="flex-1 bg-white rounded-2xl border overflow-hidden flex flex-col shadow-sm min-h-[300px]">
                                <div className="flex border-b bg-slate-50">
                                    <button onClick={() => setActiveInvTab("summary")} className={`flex-1 py-2.5 text-xs font-black transition-all ${activeInvTab === "summary" ? "bg-white text-emerald-700 border-b-2 border-emerald-600" : "text-slate-400"}`}>
                                        📊 현재고 요약 ({summaryInventory.length}종)
                                    </button>
                                    <button onClick={() => setActiveInvTab("history")} className={`flex-1 py-2.5 text-xs font-black transition-all ${activeInvTab === "history" ? "bg-white text-blue-700 border-b-2 border-blue-600" : "text-slate-400"}`}>
                                        📜 과거 입고 이력 ({filteredHistoryList.length}건)
                                    </button>
                                    <button onClick={() => setActiveInvTab("recipeReq")} className={`flex-1 py-2.5 text-xs font-black transition-all ${activeInvTab === "recipeReq" ? "bg-white text-indigo-700 border-b-2 border-indigo-600" : "text-slate-400"}`}>
                                        📖 레시피 소요 분석 ({todayRecipes.length})
                                    </button>
                                    <button onClick={() => setActiveInvTab("receipts")} className={`flex-1 py-2.5 text-xs font-black transition-all ${activeInvTab === "receipts" ? "bg-white text-slate-700 border-b-2 border-slate-600" : "text-slate-400"}`}>
                                        📄 거래명세서 내역 ({receiptList.length})
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-2">
                                    {activeInvTab === "summary" ? (
                                        <div>
                                            <div className="flex justify-between items-center p-2 bg-slate-50 rounded-xl mb-2 border text-xs font-bold">
                                                <span className="text-slate-600">품목별로 합산된 실시간 총 재고입니다.</span>
                                                <label className="flex items-center gap-1 cursor-pointer text-slate-700 font-black">
                                                    <input type="checkbox" checked={showZeroStock} onChange={e => setShowZeroStock(e.target.checked)} className="accent-emerald-600" />
                                                    <span>소진 항목(재고 0) 포함 보기</span>
                                                </label>
                                            </div>
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="border-b bg-slate-50 text-[10px] font-black text-slate-500">
                                                        <th className="p-2">부문</th>
                                                        <th className="p-2">품목명</th>
                                                        <th className="p-2 text-center">총 입고량</th>
                                                        <th className="p-2 text-center">현재 잔여 재고</th>
                                                        <th className="p-2 text-right">총 재고 금액</th>
                                                        <th className="p-2 text-center">최근 입고일</th>
                                                        <th className="p-2 text-center">수기 보정</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y text-xs font-bold">
                                                    {isLoadingInv ? (
                                                        <tr><td colSpan="7" className="p-4 text-center text-slate-400">데이터 불러오는 중...</td></tr>
                                                    ) : summaryInventory.length === 0 ? (
                                                        <tr><td colSpan="7" className="p-4 text-center text-slate-400">표시할 재고 품목이 없습니다.</td></tr>
                                                    ) : (
                                                        summaryInventory.map((item, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-50">
                                                                <td className="p-2 text-slate-600">{item.section}</td>
                                                                <td className="p-2 font-black text-slate-800">{item.name}</td>
                                                                <td className="p-2 text-center text-slate-500">{item.totalInQty} {item.unit}</td>
                                                                <td className={`p-2 text-center font-black ${item.totalInvQty > 0 ? "text-blue-600 text-sm" : "text-red-500"}`}>
                                                                    {item.totalInvQty} {item.unit}
                                                                </td>
                                                                <td className="p-2 text-right font-black text-emerald-800">{Number(item.totalInvAmount).toLocaleString()}원</td>
                                                                <td className="p-2 text-center text-slate-400 text-[11px]">{item.lastDate}</td>
                                                                <td className="p-2 text-center">
                                                                    <button onClick={() => handleManualQtyUpdate({ name: item.name, invQty: item.totalInvQty, unit: item.unit, rowIdx: item.latestRowIdx })} className="bg-slate-200 text-slate-700 px-2 py-1 rounded text-[10px] font-black hover:bg-slate-300">
                                                                        ✏️ 보정
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : activeInvTab === "history" ? (
                                        <div>
                                            <div className="flex gap-2 mb-2 p-1 bg-slate-100 rounded-xl">
                                                <button onClick={() => setHistoryFilter("all")} className={`flex-1 py-1.5 rounded-lg text-xs font-black ${historyFilter === "all" ? "bg-white text-blue-600 shadow-sm" : "text-slate-500"}`}>전체</button>
                                                <button onClick={() => setHistoryFilter("today")} className={`flex-1 py-1.5 rounded-lg text-xs font-black ${historyFilter === "today" ? "bg-white text-blue-600 shadow-sm" : "text-slate-500"}`}>오늘</button>
                                                <button onClick={() => setHistoryFilter("week")} className={`flex-1 py-1.5 rounded-lg text-xs font-black ${historyFilter === "week" ? "bg-white text-blue-600 shadow-sm" : "text-slate-500"}`}>최근 7일</button>
                                                <button onClick={() => setHistoryFilter("month")} className={`flex-1 py-1.5 rounded-lg text-xs font-black ${historyFilter === "month" ? "bg-white text-blue-600 shadow-sm" : "text-slate-500"}`}>이번 달</button>
                                            </div>
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="border-b bg-slate-50 text-[10px] font-black text-slate-500">
                                                        <th className="p-2">입고일자</th>
                                                        <th className="p-2">부문</th>
                                                        <th className="p-2">품목명</th>
                                                        <th className="p-2 text-center">입고량</th>
                                                        <th className="p-2 text-center">당시재고</th>
                                                        <th className="p-2 text-right">단가</th>
                                                        <th className="p-2 text-right">공급가액</th>
                                                        <th className="p-2">비고/소요이력</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y text-xs font-bold">
                                                    {isLoadingInv ? (
                                                        <tr><td colSpan="8" className="p-4 text-center text-slate-400">데이터 불러오는 중...</td></tr>
                                                    ) : filteredHistoryList.length === 0 ? (
                                                        <tr><td colSpan="8" className="p-4 text-center text-slate-400">해당 기간의 입고 기록이 없습니다.</td></tr>
                                                    ) : (
                                                        filteredHistoryList.map((item, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-50">
                                                                <td className="p-2 text-slate-500 font-bold text-[11px]">{item.date || "-"}</td>
                                                                <td className="p-2 text-slate-600">{item.section || "-"}</td>
                                                                <td className="p-2 font-black text-slate-800">{item.name || "-"}</td>
                                                                <td className="p-2 text-center font-black text-emerald-600">{item.inQty ?? 0} {item.unit || ''}</td>
                                                                <td className="p-2 text-center font-black text-blue-600">{item.invQty ?? 0} {item.unit || ''}</td>
                                                                <td className="p-2 text-right text-slate-700">{item.price ? Number(item.price).toLocaleString() + "원" : "-"}</td>
                                                                <td className="p-2 text-right font-black text-slate-900">{typeof item.supplyPrice === 'number' ? Number(item.supplyPrice).toLocaleString() + "원" : item.supplyPrice || "-"}</td>
                                                                <td className="p-2 text-[10px] text-slate-500 max-w-[150px] truncate">{item.note || "-"}</td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : activeInvTab === "recipeReq" ? (
                                        <div className="p-3 space-y-4">
                                            <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl">
                                                <div className="text-xs font-black text-blue-800 mb-1">📅 선택된 날짜 ({selectedDate?.date || "날짜 미선택"}) 전체 메뉴 소요 식재료 및 부자재 분석</div>
                                                <div className="text-[11px] text-blue-600 font-bold leading-relaxed">
                                                    조식: {selectedDate?.morning || "없음"} / 중식: {selectedDate?.lunch || "없음"} / 석식: {selectedDate?.dinner || "없음"} / 포장: {selectedDate?.packing || "없음"}
                                                </div>
                                            </div>

                                            {todayRecipes.length === 0 ? (
                                                <div className="text-center py-12 text-slate-400 font-bold text-xs">선택된 날짜의 메뉴(포장 포함)에 매칭되는 레시피가 없습니다.</div>
                                            ) : (
                                                <div className="space-y-3">
                                                    {todayRecipes.map((r, rIdx) => (
                                                        <div key={rIdx} className="bg-slate-50 p-3 rounded-xl border">
                                                            <div className="font-black text-slate-800 text-sm mb-1">🍳 {r.name || r.key}</div>
                                                            <div className="text-xs font-semibold text-slate-600 bg-white p-2.5 rounded-lg border">
                                                                <span className="text-blue-600 font-black block mb-1">필요 식재료 및 배합비:</span>
                                                                <div className="whitespace-pre-wrap">{r.ingredients}</div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b bg-slate-50 text-[10px] font-black text-slate-500">
                                                    <th className="p-2">날짜</th>
                                                    <th className="p-2">명세서 제목</th>
                                                    <th className="p-2 text-center">드라이브 사진 링크</th>
                                                    <th className="p-2 text-center">등록 일시</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y text-xs font-bold">
                                                {isLoadingInv ? (
                                                    <tr><td colSpan="4" className="p-4 text-center text-slate-400">데이터 불러오는 중...</td></tr>
                                                ) : !Array.isArray(receiptList) || receiptList.length === 0 ? (
                                                    <tr><td colSpan="4" className="p-4 text-center text-slate-400">'거래명세서 내역' 시트에 등록된 데이터가 없습니다.</td></tr>
                                                ) : (
                                                    receiptList.map((item, idx) => {
                                                        const itm = (item && typeof item === 'object') ? item : {};
                                                        return (
                                                            <tr key={idx} className="hover:bg-slate-50">
                                                                <td className="p-2 text-slate-500 font-bold text-xs">{itm.date || "-"}</td>
                                                                <td className="p-2 font-black text-slate-800">{itm.title || "-"}</td>
                                                                <td className="p-2 text-center">
                                                                    {itm.photoUrl ? (
                                                                        <a href={itm.photoUrl} target="_blank" rel="noopener noreferrer" className="bg-indigo-50 text-indigo-600 border border-indigo-200 px-2.5 py-1 rounded-lg font-black text-[11px] no-underline hover:bg-indigo-100 inline-block">
                                                                            📷 사진 보기
                                                                        </a>
                                                                    ) : <span className="text-[10px] text-slate-300">없음</span>}
                                                                </td>
                                                                <td className="p-2 text-center text-slate-400 text-[11px]">{itm.createdAt || "-"}</td>
                                                            </tr>
                                                        );
                                                    })
                                                )}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 🌿 제철 식재료 모달 */}
                    {seasonalModal && (
                        <div className="modal-view">
                            <div className="flex justify-between items-center mb-4 border-b pb-2">
                                <h2 className="text-xl font-black italic text-green-700">🌿 {currentMonth.getMonth()+1}월의 제철 식재료</h2>
                                <button onClick={() => setSeasonalModal(false)} className="text-3xl">×</button>
                            </div>
                            <div className="flex-1 overflow-y-auto space-y-4 pb-10">
                                {Object.keys(groupedSeasonal).length > 0 ? Object.entries(groupedSeasonal).map(([cat, items]) => (
                                    <div key={cat} className="bg-slate-50 p-4 rounded-xl border">
                                        <h3 className="font-black text-green-700 text-sm mb-3 border-b border-green-200 pb-1">[{cat}]</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {items.map((item, idx) => (
                                                <div key={idx} className="bg-white p-3 rounded-lg border shadow-sm flex gap-3">
                                                    {item.image && <img src={formatImageUrl(item.image)} alt={item.name} className="w-20 h-20 object-cover rounded-lg border shrink-0 bg-slate-50" />}
                                                    <div className="flex-1 text-xs space-y-1">
                                                        <div className="font-black text-slate-800 text-sm">{item.name}</div>
                                                        {item.desc && <div className="text-slate-600">{item.desc}</div>}
                                                        {item.pairing && <div className="text-indigo-600 font-bold">🤝 궁합: {item.pairing}</div>}
                                                        {item.menu && <div className="text-amber-600 font-bold">🍳 추천: {item.menu}</div>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )) : <div className="text-center py-10 text-slate-400 font-bold">등록된 제철 식재료 정보가 없습니다.</div>}
                            </div>
                        </div>
                    )}

                    {/* ⭐ 중요 리뷰 모아보기 모달 */}
                    {importantModal && (
                        <div className="modal-view">
                            <div className="flex justify-between items-center mb-4 border-b pb-2">
                                <h2 className="text-xl font-black italic text-yellow-600">⭐ 중요 리뷰 모아보기</h2>
                                <button onClick={() => setImportantModal(false)} className="text-3xl">×</button>
                            </div>
                            <div className="flex-1 overflow-y-auto space-y-3 pb-10">
                                {importantComments.length > 0 ? importantComments.map((c, i) => (
                                    <div key={i} className="p-4 rounded-xl border bg-yellow-50 border-yellow-200 shadow-sm">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="text-xs font-black text-yellow-800">{c.date} | {c.name}</span>
                                            <span className="text-[10px] text-slate-400">{c.time}</span>
                                        </div>
                                        <div className="text-xs font-bold text-slate-800 whitespace-pre-wrap">{c.content}</div>
                                    </div>
                                )) : <div className="text-center py-10 text-slate-400 font-bold">중요 표시된 리뷰가 없습니다.</div>}
                            </div>
                        </div>
                    )}

                    {/* 📷 현장 보고서 모달 */}
                    {reportModal && selectedDate && (
                        <div className="modal-view">
                            <div className="flex justify-between items-center mb-3 border-b pb-2">
                                <h2 className="text-lg font-black italic text-indigo-700">📷 현장 보고서 ({selectedDate.date})</h2>
                                <button onClick={() => setReportModal(false)} className="text-3xl">×</button>
                            </div>
                            
                            <div className="flex border-b mb-4 bg-slate-50 rounded-xl p-1">
                                {['아침', '점심', '저녁'].map(t => (
                                    <button key={t} onClick={() => setActiveReportTab(t)} className={`flex-1 py-2 text-xs font-black rounded-lg transition-all ${activeReportTab === t ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500'}`}>
                                        {t} 현장보고
                                    </button>
                                ))}
                            </div>

                            <div className="flex-1 overflow-y-auto space-y-4 pb-10">
                                {(() => {
                                    const currentReport = todayReports.find(r => r.type === activeReportTab);
                                    return (
                                        <div className="bg-slate-50 p-4 rounded-2xl border space-y-4">
                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="bg-white p-3 rounded-xl border text-center">
                                                    <div className="text-xs font-black text-slate-500 mb-2">배식 전 사진</div>
                                                    {currentReport?.beforeImg ? (
                                                        <img src={formatImageUrl(currentReport.beforeImg)} alt="배식 전" className="w-full h-48 object-contain bg-slate-900 rounded-lg border mb-2" />
                                                    ) : (
                                                        <div className="w-full h-36 bg-slate-100 rounded-lg border-2 border-dashed border-slate-300 flex items-center justify-center text-xs text-slate-400 font-bold mb-2">사진 없음</div>
                                                    )}
                                                    <label className="block w-full bg-indigo-50 text-indigo-600 border border-indigo-200 py-2 rounded-lg font-black text-xs cursor-pointer hover:bg-indigo-100">
                                                        {isUploadingReport === 'before' ? '업로드 중...' : '📸 촬영/등록'}
                                                        <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleReportPhotoUpload(activeReportTab, 'before', e)} disabled={!!isUploadingReport} />
                                                    </label>
                                                </div>

                                                <div className="bg-white p-3 rounded-xl border text-center">
                                                    <div className="text-xs font-black text-slate-500 mb-2">배식 후 사진</div>
                                                    {currentReport?.afterImg ? (
                                                        <img src={formatImageUrl(currentReport.afterImg)} alt="배식 후" className="w-full h-48 object-contain bg-slate-900 rounded-lg border mb-2" />
                                                    ) : (
                                                        <div className="w-full h-36 bg-slate-100 rounded-lg border-2 border-dashed border-slate-300 flex items-center justify-center text-xs text-slate-400 font-bold mb-2">사진 없음</div>
                                                    )}
                                                    <label className="block w-full bg-indigo-50 text-indigo-600 border border-indigo-200 py-2 rounded-lg font-black text-xs cursor-pointer hover:bg-indigo-100">
                                                        {isUploadingReport === 'after' ? '업로드 중...' : '📸 촬영/등록'}
                                                        <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleReportPhotoUpload(activeReportTab, 'after', e)} disabled={!!isUploadingReport} />
                                                    </label>
                                                </div>
                                            </div>

                                            {currentReport && (
                                                <div className="bg-white p-3 rounded-xl border text-xs space-y-1">
                                                    <div className="font-bold text-slate-500">작성자: {currentReport.author || "미상"}</div>
                                                    {currentReport.content && <div className="font-bold text-slate-800 leading-relaxed">{currentReport.content}</div>}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {/* 📅 주간 메뉴표 모달 */}
                    {weeklyModal && selectedDate && (
                        <div className="modal-view">
                            <div className="flex justify-between items-center mb-4 border-b pb-2">
                                <h2 className="text-xl font-black italic">WEEKLY MENU PLAN</h2>
                                <button onClick={()=>setWeeklyModal(false)} className="text-3xl">×</button>
                            </div>
                            <div className="flex-1 overflow-y-auto pb-10">
                                {weeklyData.map((d, i) => (
                                    <div key={i} className={`mb-4 p-3 border rounded-xl ${d.date === selectedDate.date ? 'border-blue-500 bg-blue-50 ring-2 ring-blue-100' : 'bg-slate-50'}`}>
                                        <div className={`font-black mb-2 flex justify-between ${d.date === selectedDate.date ? 'text-blue-600' : 'text-slate-600'}`}>
                                            <span>{d.date} ({weekDays[d.dayIdx]})</span>
                                            {d.date === selectedDate.date && <span className="text-xs bg-blue-600 text-white px-2 py-0.5 rounded">선택됨</span>}
                                        </div>
                                        {d.menu ? (
                                            <div className="grid grid-cols-1 gap-3">
                                                <WeeklyMenuRow label="아침" colorClass="text-orange-500" text={d.menu.morning} recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />
                                                <WeeklyMenuRow label="점심" colorClass="text-blue-500" text={d.menu.lunch} recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />
                                                <WeeklyMenuRow label="저녁" colorClass="text-purple-500" text={d.menu.dinner} recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />
                                                {d.menu.packing && <WeeklyMenuRow label="포장" colorClass="text-green-600" text={d.menu.packing} recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />}
                                            </div>
                                        ) : <div className="text-slate-400 text-xs font-bold">등록된 메뉴 없음</div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 🔍 검색 결과 모달 */}
                    {activeModal && (
                        <div className="modal-view">
                            <div className="flex justify-between items-center mb-4 border-b pb-2">
                                <h2 className="text-xl font-black italic">SEARCH RESULT</h2>
                                <button onClick={()=>setActiveModal(false)} className="text-3xl">×</button>
                            </div>
                            <input className="bg-slate-100 px-4 py-3 rounded-xl w-full font-bold mb-4 border-2 border-blue-500 outline-none" placeholder="검색어..." autoFocus value={modalSearch} onChange={e=>setModalSearch(e.target.value)}/>
                            <div className="flex-1 overflow-y-auto space-y-4 pb-10">
                                {currentSearchResults.length > 0 ? currentSearchResults.map((m, i) => (
                                    <div key={i} className="bg-slate-50 p-4 rounded-xl border">
                                        <div className="font-black text-blue-600 mb-2">{m.date}</div>
                                        <MenuCard text={m.morning} type="Morning" query={modalSearch} recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} onExpand={handleExpandMenu} />
                                        <MenuCard text={m.lunch} type="Lunch" query={modalSearch} recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} onExpand={handleExpandMenu} />
                                        <MenuCard text={m.dinner} type="Dinner" query={modalSearch} recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} onExpand={handleExpandMenu} />
                                        {m.packing && <MenuCard text={m.packing} type="Takeout (포장)" query={modalSearch} recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} onExpand={handleExpandMenu} />}
                                    </div>
                                )) : <div className="text-center py-10 text-slate-400 font-bold">결과 없음</div>}
                            </div>
                        </div>
                    )}

                    {/* 🔍 메뉴 텍스트 확대 보기 팝업 */}
                    {expandedMenu && (
                        <div className="zoom-popup" onClick={() => setExpandedMenu(null)}>
                            <div className="flex justify-between items-center mb-4 border-b pb-2">
                                <h3 className="text-lg font-black text-slate-800 uppercase">🔍 {expandedMenu.type} 상세보기</h3>
                                <button onClick={() => setExpandedMenu(null)} className="text-3xl font-bold text-slate-400">×</button>
                            </div>
                            <div className="flex-1 overflow-y-auto bg-slate-50 p-6 rounded-2xl border flex items-center justify-center text-center">
                                <div className="text-2xl font-black text-slate-800 leading-relaxed whitespace-pre-wrap">{expandedMenu.text}</div>
                            </div>
                        </div>
                    )}

                    {/* 📖 레시피 팝업 모달 */}
                    {popupRecipes.length > 0 && currentRecipe && (
                        <div className="recipe-popup" onClick={() => setPopupRecipes([])}>
                            <div className="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl overflow-y-auto max-h-[85vh]" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h3 className="text-xl font-black uppercase italic text-blue-600">Recipe Master</h3>
                                    <button onClick={() => setPopupRecipes([])} className="text-4xl font-thin">×</button>
                                </div>
                                {popupRecipes.length > 1 && (
                                    <div className="flex overflow-x-auto border-b mb-4 no-scrollbar">
                                        {popupRecipes.map((r, i) => <div key={i} onClick={() => setActiveRecipeIndex(i)} className={`px-3 py-2 text-xs font-bold border-b-2 cursor-pointer ${i === activeRecipeIndex ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'}`}>{r.name || r.key}</div>)}
                                    </div>
                                )}
                                <div className="animate-in fade-in zoom-in-95 duration-200">
                                    <div className="flex gap-4 items-start mb-4">
                                        <div className="flex-1">
                                            <div className="bg-blue-600 text-white px-3 py-1 rounded-full inline-block text-xs font-black mb-3 uppercase">{currentRecipe.name || currentRecipe.key}</div>
                                            <div>
                                                <div className="text-[10px] font-black text-slate-400 uppercase mb-1">Ingredients</div>
                                                <div className="recipe-content bg-slate-50 p-3 rounded-xl border">{currentRecipe.ingredients}</div>
                                            </div>
                                        </div>
                                        {currentRecipe.image ? (
                                            <img src={formatImageUrl(currentRecipe.image)} alt={currentRecipe.name} className="w-24 h-24 object-cover rounded-xl shrink-0 border border-slate-200 shadow-sm bg-slate-100" />
                                        ) : (
                                            <div className="w-24 h-24 flex flex-col items-center justify-center rounded-xl shrink-0 border-2 border-dashed border-slate-300 bg-slate-50 p-1 text-center">
                                                <span className="text-[10px] font-bold text-slate-400 mb-1">사진 없음</span>
                                            </div>
                                        )}
                                    </div>
                                    <div className="space-y-4">
                                        <div>
                                            <div className="text-[10px] font-black text-slate-400 uppercase mb-1">Instructions</div>
                                            <div className="recipe-content bg-slate-50 p-3 rounded-xl border">{currentRecipe.process}</div>
                                        </div>
                                        {currentRecipe.tip && <div className="bg-orange-50 p-3 rounded-xl border border-orange-100 font-bold text-orange-950 text-xs">💡 {currentRecipe.tip}</div>}
                                        {currentRecipe.nutrition && <div className="bg-teal-50 p-3 rounded-xl border border-teal-100 font-bold text-teal-900 text-xs">📊 {currentRecipe.nutrition}</div>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<MiseOnApp />);
    </script>
</body>
</html>
