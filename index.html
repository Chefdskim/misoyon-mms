 <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mise-On : Smart Kitchen System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
        #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #cbd5e1; gap: 1px; border: 1px solid #cbd5e1; flex: 1; overflow-y: auto; grid-auto-rows: minmax(60px, 1fr); } 
        @media (min-width: 1024px) { .calendar-grid { grid-template-rows: 25px repeat(6, 1fr); grid-auto-rows: auto; } }
        .calendar-header { background: #f8fafc; text-align: center; font-size: 9px; font-weight: 900; color: #94a3b8; padding: 4px 0; }
        .calendar-day { background: white; padding: 2px 4px; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; min-height: 0; position: relative; }
        .calendar-day.selected { background: #eff6ff !important; box-shadow: inset 0 0 0 2px #3b82f6; z-index: 10; }
        .menu-text { font-size: 9px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; padding: 1px 2px; border-radius: 2px; }
        
        .modal-view { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; padding: 15px; animation: slideUp 0.3s ease-out; }
        .recipe-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .recipe-tag { display: inline-block; background: #eff6ff; color: #2563eb; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-right: 4px; margin-top: 4px; border: 1px solid #bfdbfe; cursor: pointer; }
        .recipe-content { font-size: 13px; font-weight: 600; color: #1e293b; line-height: 1.7; white-space: pre-wrap; }
        
        .login-screen { position: fixed; inset: 0; background: #f8fafc; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 320px; text-align: center; }
        .login-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; font-weight: 700; }
        .login-btn { width: 100%; background: #3b82f6; color: white; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 14px; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 📌 깃허브 전용 기본 Apps Script API URL
        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbz_7KRW_j6AwOWZOdLhTxfeGSCD1gvuHlb0EKUbwPzstN-kHJDI7KB0Qmy_3h9sqmiZGw/exec";

        const getTodayStr = () => {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const normalizeDate = (dStr) => {
            if (!dStr) return "";
            const str = String(dStr).trim();
            let match = str.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) return `${match[1]}-${String(match[2]).padStart(2, '0')}-${String(match[3]).padStart(2, '0')}`;
            match = str.match(/(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) return `2026-${String(match[1]).padStart(2, '0')}-${String(match[2]).padStart(2, '0')}`;
            const digits = str.replace(/[^\d]/g, "");
            if (digits.length === 8) return `${digits.substring(0,4)}-${digits.substring(4,6)}-${digits.substring(6,8)}`;
            return str;
        };

        // 📌 괄호 () 및 특수문자, 공백 완전 제거
        const cleanStr = (s) => {
            if (!s) return "";
            return String(s)
                .replace(/\([^)]*\)/g, "")
                .replace(/\[[^\]]*\]/g, "")
                .replace(/[^가-힣a-zA-Z0-9]/g, "")
                .toLowerCase();
        };

        // 📌 1:1 완전 일치 레시피 매칭
        const findMatchedRecipes = (menuText, recipeMap) => {
            if (!menuText || menuText === "일정없음" || !recipeMap) return [];
            const recipes = Object.values(recipeMap);
            if (recipes.length === 0) return [];

            const dishTokens = menuText.split(/[\/\n,\+&\|>:]+/).map(s => s.trim()).filter(Boolean);
            const matchedRecipes = [];

            dishTokens.forEach(dish => {
                const dishNorm = cleanStr(dish);
                if (!dishNorm) return;

                const exactMatch = recipes.find(recipe => {
                    if (!recipe) return false;
                    const keyNorm = cleanStr(recipe.key);
                    const nameNorm = cleanStr(recipe.name);
                    return (keyNorm && dishNorm === keyNorm) || (nameNorm && dishNorm === nameNorm);
                });

                if (exactMatch && !matchedRecipes.some(m => m.key === exactMatch.key)) {
                    matchedRecipes.push(exactMatch);
                }
            });

            return matchedRecipes;
        };

        const MenuCard = ({text, type, recipeMap, setPopupRecipes, setActiveRecipeIndex}) => {
            const matched = findMatchedRecipes(text, recipeMap);
            return (
                <div className={`p-4 rounded-xl border mb-3 transition-all ${matched.length > 0 ? 'bg-blue-50 border-blue-200' : 'bg-slate-50 border-slate-100'}`}>
                    <div className="text-[10px] font-black text-slate-400 uppercase mb-1 flex justify-between">
                        <span>{type}</span>
                        {matched.length > 0 && <span className="text-blue-500 font-bold">📖 레시피 {matched.length}건</span>}
                    </div>
                    <div className="text-sm font-black text-slate-700 mb-2 leading-relaxed whitespace-pre-wrap">{text || "일정없음"}</div>
                    {matched.length > 0 && (
                        <div className="flex flex-wrap gap-1 mt-2 pt-2 border-t border-blue-100">
                            {matched.map((r, idx) => (
                                <span key={idx} className="recipe-tag" onClick={() => { setPopupRecipes(matched); setActiveRecipeIndex(idx); }}>📖 {r.name || r.key}</span>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const MiseOnApp = () => {
            const USER_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=1190342038&single=true&output=csv";
            const MENU_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=0&single=true&output=csv";

            const [webAppUrl, setWebAppUrl] = useState(() => localStorage.getItem("misoyon_webapp_url") || DEFAULT_GAS_URL);
            const ADMIN_NAME = "관리자";
            const ADMIN_CODE = "2026";

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState("");
            const [inputName, setInputName] = useState("");
            const [inputCode, setInputCode] = useState("");
            const [loginError, setLoginError] = useState("");
            const [userList, setUserList] = useState([]);
            
            const [menus, setMenus] = useState([]);
            const [selectedDate, setSelectedDate] = useState(null);
            const [recipeMap, setRecipeMap] = useState({});

            const [currentMonth, setCurrentMonth] = useState(new Date());

            const [popupRecipes, setPopupRecipes] = useState([]);
            const [activeRecipeIndex, setActiveRecipeIndex] = useState(0);

            const [inventoryModal, setInventoryModal] = useState(false);
            const [activeInvTab, setActiveInvTab] = useState("inventory");
            const [inventoryList, setInventoryList] = useState([]);
            const [receiptList, setReceiptList] = useState([]);

            const fetchInventoryData = () => {
                if (!webAppUrl) return;
                const separator = webAppUrl.includes('?') ? '&' : '?';
                fetch(`${webAppUrl}${separator}mode=inventory&t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(data => {
                    if (data.inventory) setInventoryList(data.inventory);
                    if (data.receipts) setReceiptList(data.receipts);
                    if (data.recipesFromSheet && data.recipesFromSheet.length > 0) {
                        const newMap = {};
                        data.recipesFromSheet.forEach(r => {
                            if (r.key) newMap[r.key] = r;
                            if (r.name && r.name !== r.key) newMap[r.name] = r;
                        });
                        setRecipeMap(newMap);
                    }
                })
                .catch(() => {});
            };

            const fetchData = () => {
                Papa.parse(USER_URL, { 
                    download: true,
                    complete: (res) => {
                        const users = [];
                        if (res?.data) res.data.forEach(row => { if (row[1]) users.push({ name: (row[0]||"").trim(), code: (row[1]||"").trim() }); });
                        setUserList(users);
                    }
                });

                Papa.parse(MENU_URL, { 
                    download: true, 
                    complete: (res) => {
                        let temp = []; let headers = [];
                        if (res?.data) {
                            res.data.forEach(row => {
                                const label = (row[0] || "").replace(/\s/g, "");
                                const vals = row.slice(1);
                                if (label === "날짜") {
                                    headers = vals.map(v => normalizeDate(v));
                                    headers.forEach(d => { if(d) temp.push({ date: d, morning: "", lunch: "", dinner: "", packing: "" }); });
                                } else if (headers.length > 0) {
                                    vals.forEach((v, i) => {
                                        if (!headers[i]) return;
                                        const t = temp.find(m => m.date === headers[i]);
                                        if (t && v && String(v).trim() !== "") {
                                            if (label.includes("아침")) t.morning = v;
                                            else if (label.includes("점심")) t.lunch = v;
                                            else if (label.includes("저녁")) t.dinner = v;
                                            else if (label.includes("포장") || label.includes("Takeout") || label.includes("테이크아웃")) t.packing = v;
                                        }
                                    });
                                }
                            });
                        }
                        setMenus(temp);
                        const todayStr = getTodayStr();
                        setSelectedDate(temp.find(m => m.date === todayStr) || { date: todayStr, morning: "", lunch: "", dinner: "", packing: "" });
                    }
                });

                fetchInventoryData();
            };

            useEffect(() => { if (isAuthenticated) fetchData(); }, [isAuthenticated, webAppUrl]);
            useEffect(() => { const saved = localStorage.getItem("misoyon_user"); if (saved) { setIsAuthenticated(true); setCurrentUser(saved); } }, []);

            // 📌 [핵심] 아침, 점심, 저녁 + 테이크아웃(포장) 메뉴까지 분석 대상 포함
            const todayRecipes = useMemo(() => {
                if (!selectedDate) return [];
                const combinedText = `${selectedDate.morning || ""} ${selectedDate.lunch || ""} ${selectedDate.dinner || ""} ${selectedDate.packing || ""}`;
                return findMatchedRecipes(combinedText, recipeMap);
            }, [selectedDate, recipeMap]);

            const handleLogin = () => {
                const foundUser = Array.isArray(userList) ? userList.find(u => u.name === inputName.trim() && u.code === inputCode.trim()) : null;
                if (foundUser) { setIsAuthenticated(true); setCurrentUser(foundUser.name); localStorage.setItem("misoyon_user", foundUser.name); }
                else if (inputName.trim() === ADMIN_NAME && inputCode.trim() === ADMIN_CODE) { setIsAuthenticated(true); setCurrentUser("관리자"); localStorage.setItem("misoyon_user", "관리자"); }
                else { setLoginError("이름 또는 코드를 확인하세요."); }
            };

            const handleLogout = () => { setIsAuthenticated(false); setCurrentUser(""); localStorage.removeItem("misoyon_user"); window.location.reload(); };

            const calDays = useMemo(() => {
                const year = currentMonth.getFullYear(), month = currentMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const lastDate = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= lastDate; i++) {
                    const ds = normalizeDate(`${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
                    days.push({ day: i, dateStr: ds, data: menus.find(m => m.date === ds) });
                }
                while (days.length < 42) days.push(null);
                return days;
            }, [currentMonth, menus]);

            const currentRecipe = popupRecipes[activeRecipeIndex];
            const weekDays = ['일','월','화','수','목','금','토'];

            if (!isAuthenticated) {
                return (
                    <div className="login-screen">
                        <div className="login-box">
                            <h1 className="text-3xl font-black italic tracking-tighter mb-2">Mise-On</h1>
                            <p className="text-xs text-blue-600 font-bold mb-6">Digital Mise-en-place</p>
                            <input type="text" className="login-input" placeholder="이름 (Name)" value={inputName} onChange={e => setInputName(e.target.value)} />
                            <input type="password" className="login-input" placeholder="비밀번호 (Code)" value={inputCode} onChange={e => setInputCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} className="login-btn">LOGIN</button>
                            {loginError && <p className="text-red-500 text-xs font-bold mt-3">{loginError}</p>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full w-full">
                    <header className="flex justify-between items-center px-4 py-3 bg-white border-b shrink-0">
                        <div>
                            <h1 className="text-xl font-black italic tracking-tighter">Mise-On <span className="text-blue-600 text-xs not-italic">v3.5</span></h1>
                            <div className="text-[10px] text-slate-400 font-bold">Smart Kitchen System</div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => { setInventoryModal(true); fetchInventoryData(); }} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-black text-xs shadow-sm">📦 입고 및 재고 관리</button>
                            <button onClick={handleLogout} className="bg-red-500 text-white px-3 py-1.5 rounded-xl font-black text-xs">OUT</button>
                        </div>
                    </header>

                    <main className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                        <div className="flex-[2] flex flex-col min-h-[55%] lg:min-h-full border-r overflow-hidden">
                            <div className="calendar-grid">
                                {weekDays.map(d=><div key={d} className="calendar-header">{d}</div>)}
                                {calDays.map((d,i)=>(
                                    <div key={i} className={`calendar-day ${d?.dateStr === selectedDate?.date ? 'selected' : ''}`} onClick={()=>d?.data && setSelectedDate(d.data)}>
                                        {d && (<><span className={`text-[10px] font-black ${d.data ? 'text-slate-800' : 'text-slate-300'}`}>{d.day}</span>
                                        {d.data && (<div className="flex flex-col gap-[1px] mt-[1px]">
                                            {d.data.morning && <div className="menu-text bg-orange-50 text-orange-600">조:{d.data.morning}</div>}
                                            {d.data.lunch && <div className="menu-text bg-blue-50 text-blue-600">중:{d.data.lunch}</div>}
                                            {d.data.dinner && <div className="menu-text bg-purple-50 text-purple-600">석:{d.data.dinner}</div>}
                                            {d.data.packing && <div className="menu-text bg-green-50 text-green-700">포:{d.data.packing}</div>}
                                        </div>)}</>)}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <aside className="flex-1 bg-white p-4 overflow-y-auto min-h-[45%]">
                            {selectedDate ? (
                                <div className="space-y-4">
                                    <h2 className="text-xl font-black italic border-b-2 border-blue-600 pb-1">DAILY MENU</h2>
                                    <div className="font-bold text-slate-500 text-sm mb-2">{selectedDate.date}</div>
                                    <MenuCard text={selectedDate.morning} type="Morning" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />
                                    <MenuCard text={selectedDate.lunch} type="Lunch" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />
                                    <MenuCard text={selectedDate.dinner} type="Dinner" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />
                                    {selectedDate.packing && <MenuCard text={selectedDate.packing} type="Takeout (포장)" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />}
                                </div>
                            ) : <div className="h-full flex items-center justify-center text-slate-300 font-black">SELECT DATE</div>}
                        </aside>
                    </main>

                    {/* 입고 및 재고 관리 모달 */}
                    {inventoryModal && (
                        <div className="modal-view bg-slate-100 overflow-y-auto">
                            <div className="flex justify-between items-center mb-3 bg-white p-4 rounded-2xl border shadow-sm">
                                <h2 className="text-lg font-black text-emerald-700 italic">📦 입고 및 재고 관리</h2>
                                <button onClick={() => setInventoryModal(false)} className="text-2xl font-bold text-slate-400">×</button>
                            </div>

                            <div className="flex border-b bg-white rounded-t-2xl">
                                <button onClick={() => setActiveInvTab("inventory")} className={`flex-1 py-2.5 text-xs font-black ${activeInvTab === "inventory" ? "text-emerald-700 border-b-2 border-emerald-600" : "text-slate-400"}`}>
                                    📋 재고 내역 ({inventoryList.length})
                                </button>
                                <button onClick={() => setActiveInvTab("recipeReq")} className={`flex-1 py-2.5 text-xs font-black ${activeInvTab === "recipeReq" ? "text-blue-700 border-b-2 border-blue-600" : "text-slate-400"}`}>
                                    📖 테이크아웃 포함 레시피 분석 ({todayRecipes.length})
                                </button>
                            </div>

                            <div className="bg-white p-4 rounded-b-2xl border border-t-0 flex-1 overflow-y-auto min-h-[300px]">
                                {activeInvTab === "inventory" ? (
                                    <table className="w-full text-left border-collapse text-xs font-bold">
                                        <thead>
                                            <tr className="border-b bg-slate-50 text-[10px] text-slate-500">
                                                <th className="p-2">날짜</th>
                                                <th className="p-2">부문</th>
                                                <th className="p-2">품목명</th>
                                                <th className="p-2 text-center">재고량</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {inventoryList.map((item, idx) => (
                                                <tr key={idx}>
                                                    <td className="p-2">{item.date}</td>
                                                    <td className="p-2">{item.section}</td>
                                                    <td className="p-2 font-black">{item.name}</td>
                                                    <td className="p-2 text-center font-black text-blue-600">{item.invQty} {item.unit}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl">
                                            <div className="text-xs font-black text-blue-800 mb-1">📅 ({selectedDate?.date}) 전체 메뉴 소요 식재료 분석</div>
                                            <div className="text-[11px] text-blue-600 font-bold leading-relaxed">
                                                조식: {selectedDate?.morning || "없음"} / 중식: {selectedDate?.lunch || "없음"} / 석식: {selectedDate?.dinner || "없음"} / 포장: {selectedDate?.packing || "없음"}
                                            </div>
                                        </div>

                                        {todayRecipes.length === 0 ? (
                                            <div className="text-center py-10 text-slate-400 font-bold text-xs">매칭되는 레시피가 없습니다.</div>
                                        ) : (
                                            todayRecipes.map((r, rIdx) => (
                                                <div key={rIdx} className="bg-slate-50 p-3 rounded-xl border">
                                                    <div className="font-black text-slate-800 text-sm mb-1">🍳 {r.name || r.key}</div>
                                                    <div className="text-xs font-semibold text-slate-600 bg-white p-2.5 rounded-lg border">
                                                        <span className="text-blue-600 font-black block mb-1">필요 식재료 및 상세 배합비:</span>
                                                        <div className="whitespace-pre-wrap">{r.ingredients}</div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 레시피 팝업 */}
                    {popupRecipes.length > 0 && currentRecipe && (
                        <div className="recipe-popup" onClick={() => setPopupRecipes([])}>
                            <div className="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h3 className="text-xl font-black italic text-blue-600">Recipe Master</h3>
                                    <button onClick={() => setPopupRecipes([])} className="text-4xl font-thin">×</button>
                                </div>
                                <div className="bg-blue-600 text-white px-3 py-1 rounded-full inline-block text-xs font-black mb-3">{currentRecipe.name || currentRecipe.key}</div>
                                <div className="space-y-3">
                                    <div>
                                        <div className="text-[10px] font-black text-slate-400 uppercase mb-1">Ingredients</div>
                                        <div className="recipe-content bg-slate-50 p-3 rounded-xl border">{currentRecipe.ingredients}</div>
                                    </div>
                                    <div>
                                        <div className="text-[10px] font-black text-slate-400 uppercase mb-1">Instructions</div>
                                        <div className="recipe-content bg-slate-50 p-3 rounded-xl border">{currentRecipe.process}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<MiseOnApp />);
    </script>
</body>
</html>
