 <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mise-On : Smart Kitchen System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
        #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #cbd5e1; gap: 1px; border: 1px solid #cbd5e1; flex: 1; overflow-y: auto; grid-auto-rows: minmax(60px, 1fr); } 
        @media (min-width: 1024px) { .calendar-grid { grid-template-rows: 25px repeat(6, 1fr); grid-auto-rows: auto; } }
        .calendar-header { background: #f8fafc; text-align: center; font-size: 9px; font-weight: 900; color: #94a3b8; padding: 4px 0; }
        .calendar-day { background: white; padding: 2px 4px; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; min-height: 0; position: relative; }
        .calendar-day.selected { background: #eff6ff !important; box-shadow: inset 0 0 0 2px #3b82f6; z-index: 10; }
        .menu-text { font-size: 9px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; padding: 1px 2px; border-radius: 2px; }
        
        .modal-view { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; padding: 15px; animation: slideUp 0.3s ease-out; }
        .recipe-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .zoom-popup { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 1500; display: flex; flex-direction: column; padding: 20px; animation: zoomIn 0.2s ease-out; }
        .recipe-tag { display: inline-block; background: #eff6ff; color: #2563eb; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-right: 4px; margin-top: 4px; border: 1px solid #bfdbfe; cursor: pointer; transition: all 0.2s; }
        .recipe-content { font-size: 13px; font-weight: 600; color: #1e293b; line-height: 1.7; white-space: pre-wrap; }
        .hl-red { color: #ef4444; text-decoration: underline; font-weight: 900; }
        
        .login-screen { position: fixed; inset: 0; background: #f8fafc; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 320px; text-align: center; }
        .login-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; transition: all 0.2s; font-weight: 700; }
        .login-btn { width: 100%; background: #3b82f6; color: white; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 14px; margin-top: 4px; }
        .imp-check { width: 18px; height: 18px; accent-color: #f59e0b; cursor: pointer; }
        .spin-anim { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SERVER_WEB_APP_URL = "<?= scriptUrl ?>";

        const getTodayStr = () => {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        };

        const compressImage = (file, maxWidth = 800, quality = 0.6) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
                    };
                    img.onerror = () => resolve(null);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        };

        const MiseOnApp = () => {
            const [webAppUrl, setWebAppUrl] = useState(() => {
                if (SERVER_WEB_APP_URL && !SERVER_WEB_APP_URL.includes("scriptUrl")) return SERVER_WEB_APP_URL;
                return localStorage.getItem("misoyon_webapp_url") || "https://script.google.com/macros/s/AKfycbz_7KRW_j6AwOWZOdLhTxfeGSCD1gvuHlb0EKUbwPzstN-kHJDI7KB0Qmy_3h9sqmiZGw/exec";
            });

            const ADMIN_NAME = "관리자";
            const ADMIN_CODE = "2026";

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState("");
            const [inputName, setInputName] = useState("");
            const [inputCode, setInputCode] = useState("");
            const [loginError, setLoginError] = useState("");

            const [inventoryModal, setInventoryModal] = useState(false);
            const [inventoryList, setInventoryList] = useState([]);
            const [masterList, setMasterList] = useState([]);
            const [isUploading, setIsUploading] = useState(false);
            const [isLoadingInv, setIsLoadingInv] = useState(false);

            const [inputItems, setInputItems] = useState([
                { name: "", inQty: 1, price: 0 }
            ]);

            useEffect(() => {
                const saved = localStorage.getItem("misoyon_user");
                if (saved) { setIsAuthenticated(true); setCurrentUser(saved); }
            }, []);

            const fetchInventoryData = () => {
                if (!webAppUrl) return;
                setIsLoadingInv(true);
                const separator = webAppUrl.includes('?') ? '&' : '?';
                fetch(`${webAppUrl}${separator}mode=inventory&t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(data => {
                    setIsLoadingInv(false);
                    if (data.inventory) setInventoryList(data.inventory);
                    if (data.master) setMasterList(data.master);
                })
                .catch(() => setIsLoadingInv(false));
            };

            const handlePhotoAndSave = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const validItems = inputItems.filter(item => item.name.trim() !== "");
                setIsUploading(true);

                try {
                    const base64Data = await compressImage(file, 800, 0.6);
                    fetch(webAppUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'upload_inventory',
                            imageBase64: base64Data,
                            items: validItems
                        })
                    })
                    .then(res => res.json())
                    .then(resData => {
                        setIsUploading(false);
                        e.target.value = "";
                        if (resData.status === 'success') {
                            alert("거래명세서 드라이브 보관 및 [입고 및 재고 관리] 시트 등록이 완료되었습니다!");
                            setInputItems([{ name: "", inQty: 1, price: 0 }]);
                            if (resData.inventory) setInventoryList(resData.inventory);
                            if (resData.master) setMasterList(resData.master);
                        } else alert("저장 실패: " + (resData.message || "오류"));
                    })
                    .catch(() => {
                        setIsUploading(false);
                        e.target.value = "";
                        alert("네트워크 오류가 발생했습니다.");
                    });
                } catch(err) { setIsUploading(false); e.target.value = ""; }
            };

            const handleAddRow = () => setInputItems([...inputItems, { name: "", inQty: 1, price: 0 }]);
            const handleRemoveRow = (idx) => setInputItems(inputItems.filter((_, i) => i !== idx));
            const handleInputChange = (idx, field, val) => {
                const updated = [...inputItems];
                updated[idx][field] = val;
                setInputItems(updated);
            };

            const handleLogin = () => {
                if (inputName.trim() === ADMIN_NAME && inputCode.trim() === ADMIN_CODE) {
                    setIsAuthenticated(true); setCurrentUser("관리자"); localStorage.setItem("misoyon_user", "관리자");
                } else setLoginError("이름 또는 코드를 확인하세요.");
            };

            if (!isAuthenticated) {
                return (
                    <div className="login-screen">
                        <div className="login-box">
                            <h1 className="text-3xl font-black italic tracking-tighter mb-2">Mise-On</h1>
                            <p className="text-xs text-blue-600 font-bold mb-6">Smart Kitchen Inventory System</p>
                            <input type="text" className="login-input" placeholder="이름" value={inputName} onChange={e => setInputName(e.target.value)} />
                            <input type="password" className="login-input" placeholder="코드" value={inputCode} onChange={e => setInputCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} className="login-btn">LOGIN</button>
                            {loginError && <p className="text-red-500 text-xs font-bold mt-3">{loginError}</p>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 flex flex-col h-full bg-slate-50">
                    {/* 품목 마스터 드롭다운 데이터리스트 */}
                    <datalist id="master-item-list">
                        {masterList.map((m, idx) => <option key={idx} value={m} />)}
                    </datalist>

                    <div className="flex justify-between items-center mb-4 bg-white p-4 rounded-2xl border shadow-sm">
                        <div>
                            <h1 className="text-xl font-black italic text-emerald-700">Mise-On : 재고관리 & 식수 차감 연동</h1>
                            <p className="text-xs text-slate-400 font-bold">통합 스프레드시트 스마트 자동화 시스템</p>
                        </div>
                        <button onClick={() => { setInventoryModal(true); fetchInventoryData(); }} className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-black text-sm shadow-md hover:bg-emerald-700">📦 재고 관리 열기</button>
                    </div>

                    {inventoryModal && (
                        <div className="modal-view bg-slate-100">
                            <div className="flex justify-between items-center mb-4 bg-white p-4 rounded-2xl border shadow-sm">
                                <div>
                                    <h2 className="text-lg font-black text-emerald-700">📦 입고 및 재고 관리 (드롭다운 & 자동등록 지원)</h2>
                                    <p className="text-xs text-slate-400 font-bold">초성/품목명 입력 시 품목 마스터에서 자동 검색되며, 신규 품목은 마스터에 자동 추가됩니다.</p>
                                </div>
                                <button onClick={() => setInventoryModal(false)} className="text-3xl font-bold text-slate-400 px-2">×</button>
                            </div>

                            <div className="bg-white p-4 rounded-2xl border shadow-sm mb-4 space-y-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-black text-slate-700">식재료 입고 품목 입력 (품목 마스터 연동)</span>
                                    <button onClick={handleAddRow} className="bg-slate-800 text-white px-2.5 py-1 rounded-lg text-xs font-black">+ 품목 추가</button>
                                </div>
                                
                                <div className="space-y-2">
                                    {inputItems.map((item, idx) => (
                                        <div key={idx} className="flex gap-2 items-center">
                                            <input list="master-item-list" className="flex-1 px-3 py-2 rounded-xl border text-xs font-bold outline-none focus:border-emerald-500" placeholder="품목명 검색/선택 (초성 또는 단어)" value={item.name} onChange={e => handleInputChange(idx, 'name', e.target.value)} />
                                            <input type="number" className="w-16 px-2 py-2 rounded-xl border text-xs font-bold text-center outline-none" placeholder="수량" value={item.inQty} onChange={e => handleInputChange(idx, 'inQty', Number(e.target.value))} />
                                            <input type="number" className="w-24 px-2 py-2 rounded-xl border text-xs font-bold text-right outline-none" placeholder="단가(원)" value={item.price} onChange={e => handleInputChange(idx, 'price', Number(e.target.value))} />
                                            <button onClick={() => handleRemoveRow(idx)} className="text-red-500 font-bold px-2">×</button>
                                        </div>
                                    ))}
                                </div>

                                <label className="block w-full bg-emerald-600 text-white text-center py-3 rounded-xl font-black text-sm cursor-pointer shadow-md hover:bg-emerald-700">
                                    {isUploading ? "드라이브 보관 및 시트 저장 중..." : "📷 거래명세서 사진 촬영 및 시트에 자동 저장"}
                                    <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhotoAndSave} disabled={isUploading} />
                                </label>
                            </div>

                            <div className="flex-1 bg-white rounded-2xl border overflow-y-auto p-2 shadow-sm">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b bg-slate-50 text-[11px] font-black text-slate-500">
                                            <th className="p-2">입고일자</th>
                                            <th className="p-2">부문</th>
                                            <th className="p-2">품목명</th>
                                            <th className="p-2 text-center">입고량</th>
                                            <th className="p-2 text-right">단가</th>
                                            <th className="p-2 text-right">공급가액(자동)</th>
                                            <th className="p-2 text-right">명세서 원본</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y text-xs font-bold">
                                        {isLoadingInv ? (
                                            <tr><td colSpan="7" className="p-4 text-center text-slate-400">데이터 불러오는 중...</td></tr>
                                        ) : inventoryList.length === 0 ? (
                                            <tr><td colSpan="7" className="p-4 text-center text-slate-400">등록된 입고 데이터가 없습니다. 명세서 사진을 촬영해 보세요.</td></tr>
                                        ) : (
                                            inventoryList.map((item, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="p-2 text-slate-400 text-[11px]">{item.date}</td>
                                                    <td className="p-2 text-slate-600">{item.section}</td>
                                                    <td className="p-2 font-black text-slate-800">{item.name}</td>
                                                    <td className="p-2 text-center font-black text-emerald-600">{item.inQty} {item.unit}</td>
                                                    <td className="p-2 text-right text-slate-700">{item.price ? item.price.toLocaleString() + "원" : "-"}</td>
                                                    <td className="p-2 text-right font-black text-slate-900">{item.supplyPrice || "-"}</td>
                                                    <td className="p-2 text-right">
                                                        {item.note && item.note.includes("http") ? (
                                                            <a href={item.note} target="_blank" rel="noopener noreferrer" className="text-blue-600 underline font-black text-[10px]">📷 사진 원본</a>
                                                        ) : "-"}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<MiseOnApp />);
    </script>
</body>
</html>
