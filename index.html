<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mise-On : Smart Kitchen System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
        #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #cbd5e1; gap: 1px; border: 1px solid #cbd5e1; flex: 1; overflow-y: auto; grid-auto-rows: minmax(60px, 1fr); } 
        @media (min-width: 1024px) { .calendar-grid { grid-template-rows: 25px repeat(6, 1fr); grid-auto-rows: auto; } }
        .calendar-header { background: #f8fafc; text-align: center; font-size: 9px; font-weight: 900; color: #94a3b8; padding: 4px 0; }
        .calendar-day { background: white; padding: 2px 4px; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; min-height: 0; position: relative; }
        .calendar-day.selected { background: #eff6ff !important; box-shadow: inset 0 0 0 2px #3b82f6; z-index: 10; }
        .menu-text { font-size: 9px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; padding: 1px 2px; border-radius: 2px; }
        
        .modal-view { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; padding: 15px; animation: slideUp 0.3s ease-out; }
        .recipe-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        
        .login-screen { position: fixed; inset: 0; background: #f8fafc; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 320px; text-align: center; }
        .login-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; transition: all 0.2s; font-weight: 700; }
        .login-btn { width: 100%; background: #3b82f6; color: white; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 14px; margin-top: 4px; }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const normalizeDate = (dStr) => {
            if (!dStr) return "";
            const str = String(dStr).trim();
            let match = str.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) return `${match[1]}-${String(match[2]).padStart(2, '0')}-${String(match[3]).padStart(2, '0')}`;
            match = str.match(/(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) return `2026-${String(match[1]).padStart(2, '0')}-${String(match[2]).padStart(2, '0')}`;
            const digits = str.replace(/[^\d]/g, "");
            if (digits.length === 8) return `${digits.substring(0,4)}-${digits.substring(4,6)}-${digits.substring(6,8)}`;
            return str;
        };

        const compressImage = (file, maxWidth = 1000, quality = 0.75) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl.split(',')[1]);
                    };
                    img.onerror = () => resolve(null);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        };

        // 월별 제철 식재료 데이터
        const SEASONAL_DATA = {
            1: ["명태", "과메기", "한라봉", "우엉", "더덕"],
            2: ["바지락", "꼬막", "아귀", "삼치", "취나물"],
            3: ["주꾸미", "달래", "냉이", "취나물", "소라"],
            4: ["키조개", "미더덕", "소라", "두릅", "병어"],
            5: ["장어", "매실", "멍게", "다첩", "갑오징어"],
            6: ["장어", "소라", "감자", "매실", "참외"],
            7: ["갈치", "장어", "옥수수", "복숭아", "수박"],
            8: ["한우꼬리", "전복", "갈치", "감자", "옥수수", "포도"],
            9: ["대하", "꽃게", "전어", "광어", "석류"],
            10: ["대하", "홍합", "굴", "삼치", "사과"],
            11: ["꼬막", "과메기", "고등어", "굴", "무"],
            12: ["방어", "굴", "과메기", "명태", "한라봉"]
        };

        const MiseOnApp = () => {
            const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1ipSLhBGgAW1U_RF9Xkez3hUl_Eiklyor-OeQ-DtHV9o/edit?usp=sharing"; 
            const USER_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=1190342038&single=true&output=csv";
            const MENU_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=0&single=true&output=csv";

            // 셰프님의 최신 배포 URL 직접 고정
            const DEFAULT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzsP6VpbSGKUt6iJr83B7FcJC5MyDZpwVSGzRuj_zJFGWLOicBIByxdLO1-1f8Mn4UFNg/exec";

            const [webAppUrl, setWebAppUrl] = useState(localStorage.getItem("misoyon_webapp_url") || DEFAULT_WEB_APP_URL);
            const [urlSettingModal, setUrlSettingModal] = useState(false);
            const [inputUrl, setInputUrl] = useState(webAppUrl);

            const ADMIN_NAME = "관리자";
            const ADMIN_CODE = "2026";

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState("");
            const [inputName, setInputName] = useState("");
            const [inputCode, setInputCode] = useState("");
            const [loginError, setLoginError] = useState("");
            const [userList, setUserList] = useState([]);
            
            const [menus, setMenus] = useState([]);
            const [selectedDate, setSelectedDate] = useState(null);

            // 레시피 팝업 State
            const [selectedRecipeMenu, setSelectedRecipeMenu] = useState(null);

            // 재고 관련 State
            const [inventoryModal, setInventoryModal] = useState(false);
            const [inventoryList, setInventoryList] = useState([]);
            const [isUploading, setIsUploading] = useState(false);
            const [isLoadingInv, setIsLoadingInv] = useState(false);

            const [inputItems, setInputItems] = useState([
                { name: "한우꼬리 반골", inQty: 1 },
                { name: "잡뼈", inQty: 1 }
            ]);

            const currentMonthNum = new Date().getMonth() + 1;
            const currentSeasonalList = SEASONAL_DATA[currentMonthNum] || [];

            const saveWebAppUrl = () => {
                if (!inputUrl.trim()) return alert("URL을 입력해 주세요.");
                localStorage.setItem("misoyon_webapp_url", inputUrl.trim());
                setWebAppUrl(inputUrl.trim());
                setUrlSettingModal(false);
                alert("웹앱 URL 연결 저장 완료!");
            };

            const fetchInventoryData = () => {
                const targetUrl = webAppUrl || DEFAULT_WEB_APP_URL;
                setIsLoadingInv(true);
                fetch(`${targetUrl}?t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(data => {
                    setIsLoadingInv(false);
                    if (Array.isArray(data)) setInventoryList(data);
                })
                .catch(err => {
                    setIsLoadingInv(false);
                    console.log(err);
                });
            };

            const fetchData = () => {
                Papa.parse(USER_URL, { 
                    download: true, header: false,
                    complete: (res) => {
                        const users = [];
                        if (res && res.data) {
                            res.data.forEach(row => { if (row.length >= 2 && row[1]) users.push({ name: (row[0]||"").trim(), code: (row[1]||"").trim() }); });
                        }
                        setUserList(users);
                    }
                });

                Papa.parse(MENU_URL, { 
                    download: true, 
                    complete: (res) => {
                        let temp = []; let headers = [];
                        if (res && res.data) {
                            res.data.forEach(row => {
                                const label = (row[0] || "").replace(/\s/g, "");
                                const vals = row.slice(1);
                                if (label === "날짜") {
                                    headers = vals.map(v => normalizeDate(v));
                                    headers.forEach(d => { if(d) temp.push({ date: d, morning: "", lunch: "", dinner: "" }); });
                                } else if (headers.length > 0) {
                                    vals.forEach((v, i) => {
                                        if (!headers[i]) return;
                                        const t = temp.find(m => m.date === headers[i]);
                                        if (t && v && String(v).trim() !== "") {
                                            if (label.includes("아침")) t.morning = v;
                                            else if (label.includes("점심")) t.lunch = v;
                                            else if (label.includes("저녁")) t.dinner = v;
                                        }
                                    });
                                }
                            });
                        }
                        setMenus(temp);
                        const todayStr = normalizeDate(new Date().toISOString().split('T')[0]);
                        setSelectedDate(temp.find(m => m.date === todayStr) || { date: todayStr, morning: "", lunch: "", dinner: "" });
                    }
                });

                fetchInventoryData();
            };

            useEffect(() => { if (isAuthenticated) fetchData(); }, [isAuthenticated, webAppUrl]);
            useEffect(() => { const saved = localStorage.getItem("misoyon_user"); if (saved) { setIsAuthenticated(true); setCurrentUser(saved); } }, []);

            const handleLogin = () => {
                const foundUser = userList.find(u => u.name === inputName.trim() && u.code === inputCode.trim());
                if (foundUser) { setIsAuthenticated(true); setCurrentUser(foundUser.name); localStorage.setItem("misoyon_user", foundUser.name); }
                else if (inputName.trim() === ADMIN_NAME && inputCode.trim() === ADMIN_CODE) { setIsAuthenticated(true); setCurrentUser("관리자"); localStorage.setItem("misoyon_user", "관리자"); }
                else { setLoginError("이름 또는 코드를 확인하세요."); }
            };

            const handleLogout = () => { setIsAuthenticated(false); setCurrentUser(""); localStorage.removeItem("misoyon_user"); window.location.reload(); };

            const handlePhotoAndSave = async (e) => {
                const targetUrl = webAppUrl || DEFAULT_WEB_APP_URL;
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);

                try {
                    const base64Data = await compressImage(file, 1000, 0.75);
                    const validItems = inputItems.filter(item => item.name.trim() !== "");

                    fetch(targetUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            imageBase64: base64Data,
                            items: validItems
                        })
                    })
                    .then(res => res.json())
                    .then(resData => {
                        setIsUploading(false);
                        if (resData.status === 'success') {
                            alert("구글 시트에 등록이 완료되었습니다!");
                            if (Array.isArray(resData.inventory)) {
                                setInventoryList(resData.inventory);
                            } else {
                                fetchInventoryData();
                            }
                        } else {
                            alert("저장 오류: " + (resData.message || "오류 발생"));
                        }
                    })
                    .catch(() => {
                        setIsUploading(false);
                        alert("전송 실패. 네트워크 상태를 확인해 주세요.");
                    });
                } catch(err) {
                    setIsUploading(false);
                }
            };

            const handleUpdateUsedQty = (item, delta) => {
                const targetUrl = webAppUrl || DEFAULT_WEB_APP_URL;
                const newUsed = Math.max(0, (item.usedQty || 0) + delta);
                fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'update_used',
                        rowNum: item.rowNum,
                        usedQty: newUsed
                    })
                })
                .then(res => res.json())
                .then(resData => {
                    if (resData.status === 'success' && Array.isArray(resData.inventory)) {
                        setInventoryList(resData.inventory);
                    }
                });
            };

            const handleAddRow = () => setInputItems([...inputItems, { name: "", inQty: 1 }]);
            const handleRemoveRow = (index) => setInputItems(inputItems.filter((_, idx) => idx !== index));
            const handleInputChange = (index, field, value) => {
                const updated = [...inputItems];
                updated[index][field] = value;
                setInputItems(updated);
            };

            const calDays = useMemo(() => {
                const year = new Date().getFullYear(), month = new Date().getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const lastDate = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= lastDate; i++) {
                    const ds = normalizeDate(`${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
                    days.push({ day: i, dateStr: ds, data: menus.find(m => m.date === ds) });
                }
                while (days.length < 42) days.push(null);
                return days;
            }, [menus]);

            const weekDays = ['일','월','화','수','목','금','토'];

            if (!isAuthenticated) {
                return (
                    <div className="login-screen">
                        <div className="login-box">
                            <h1 className="text-3xl font-black italic tracking-tighter mb-2">Mise-On</h1>
                            <p className="text-xs text-blue-600 font-bold mb-1 uppercase tracking-widest">Digital Mise-en-place</p>
                            <p className="text-[10px] text-slate-400 font-bold mb-6">Powered by Chef D.S. Kim</p>
                            <input type="text" className="login-input" placeholder="이름 (Name)" value={inputName} onChange={e => setInputName(e.target.value)} />
                            <input type="password" inputMode="numeric" className="login-input" placeholder="비밀번호 (Code)" value={inputCode} onChange={e => setInputCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} className="login-btn">LOGIN</button>
                            {loginError && <p className="text-red-500 text-xs font-bold mt-3">{loginError}</p>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full w-full">
                    <header className="flex flex-col px-4 py-3 bg-white border-b gap-3 shrink-0">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-black italic tracking-tighter">Mise-On <span className="text-blue-600 text-xs not-italic">v2.5</span></h1>
                                <div className="text-[10px] text-slate-400 font-bold">Smart Kitchen System</div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => { setInventoryModal(true); fetchInventoryData(); }} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-black text-xs shadow-sm hover:bg-emerald-700">📦 재고 관리</button>
                                
                                {currentUser === ADMIN_NAME && (
                                    <>
                                        <button onClick={() => setUrlSettingModal(true)} className="bg-amber-500 text-white px-3 py-1.5 rounded-xl font-black text-xs shadow-sm">⚙️ URL 연결</button>
                                        <a href={SHEET_EDIT_URL} target="_blank" rel="noopener noreferrer" className="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl border border-indigo-200 font-black text-xs no-underline">📊 원본 시트</a>
                                    </>
                                )}

                                <button onClick={handleLogout} className="bg-red-500 text-white px-3 py-1.5 rounded-xl font-black text-xs">OUT</button>
                            </div>
                        </div>
                    </header>

                    <main className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                        <div className="flex-[2] flex flex-col min-h-[55%] lg:min-h-full border-b lg:border-b-0 lg:border-r overflow-hidden">
                            <div className="calendar-grid">
                                {weekDays.map(d=><div key={d} className="calendar-header">{d}</div>)}
                                {calDays.map((d,i)=>(
                                    <div key={i} className={`calendar-day ${d?.dateStr === selectedDate?.date ? 'selected' : ''}`} onClick={()=>d?.data && setSelectedDate(d.data)}>
                                        {d && (<><span className={`text-[10px] font-black ${d.data ? 'text-slate-800' : 'text-slate-300'}`}>{d.day}</span>
                                        {d.data && (<div className="flex flex-col gap-[1px] mt-[1px]">
                                            {d.data.morning && <div className="menu-text bg-orange-50 text-orange-600" onClick={(e)=>{e.stopPropagation(); setSelectedRecipeMenu(d.data.morning);}}>조:{d.data.morning}</div>}
                                            {d.data.lunch && <div className="menu-text bg-blue-50 text-blue-600" onClick={(e)=>{e.stopPropagation(); setSelectedRecipeMenu(d.data.lunch);}}>중:{d.data.lunch}</div>}
                                            {d.data.dinner && <div className="menu-text bg-purple-50 text-purple-600" onClick={(e)=>{e.stopPropagation(); setSelectedRecipeMenu(d.data.dinner);}}>석:{d.data.dinner}</div>}
                                        </div>)}</>)}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <aside className="flex-1 bg-white p-4 overflow-y-auto min-h-[45%] flex flex-col justify-between">
                            {selectedDate ? (
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center border-b-2 border-blue-600 pb-1">
                                        <h2 className="text-xl font-black italic">DAILY MENU</h2>
                                        <span className="text-xs font-bold text-slate-400">{selectedDate.date}</span>
                                    </div>

                                    <div className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                                        <div>
                                            <div className="text-[10px] font-black text-slate-400 uppercase">Morning</div>
                                            <div className="text-sm font-black text-slate-700">{selectedDate.morning || "일정없음"}</div>
                                        </div>
                                        {selectedDate.morning && <button onClick={()=>setSelectedRecipeMenu(selectedDate.morning)} className="bg-blue-600 text-white px-2.5 py-1 rounded-lg text-[11px] font-black shadow-sm">📖 레시피</button>}
                                    </div>

                                    <div className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                                        <div>
                                            <div className="text-[10px] font-black text-slate-400 uppercase">Lunch</div>
                                            <div className="text-sm font-black text-slate-700">{selectedDate.lunch || "일정없음"}</div>
                                        </div>
                                        {selectedDate.lunch && <button onClick={()=>setSelectedRecipeMenu(selectedDate.lunch)} className="bg-blue-600 text-white px-2.5 py-1 rounded-lg text-[11px] font-black shadow-sm">📖 레시피</button>}
                                    </div>

                                    <div className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                                        <div>
                                            <div className="text-[10px] font-black text-slate-400 uppercase">Dinner</div>
                                            <div className="text-sm font-black text-slate-700">{selectedDate.dinner || "일정없음"}</div>
                                        </div>
                                        {selectedDate.dinner && <button onClick={()=>setSelectedRecipeMenu(selectedDate.dinner)} className="bg-blue-600 text-white px-2.5 py-1 rounded-lg text-[11px] font-black shadow-sm">📖 레시피</button>}
                                    </div>
                                </div>
                            ) : <div className="text-center text-slate-300 font-black py-4">SELECT DATE</div>}

                            {/* 🌿 복원된 제철 식재료 카드 */}
                            <div className="mt-4 p-3 bg-emerald-50 rounded-2xl border border-emerald-200">
                                <div className="flex justify-between items-center mb-1.5">
                                    <span className="text-xs font-black text-emerald-800">🌿 {currentMonthNum}월 추천 제철 식재료</span>
                                    <span className="text-[10px] bg-emerald-200 text-emerald-800 px-1.5 py-0.5 rounded font-black">Seasonal</span>
                                </div>
                                <div className="flex flex-wrap gap-1">
                                    {currentSeasonalList.map((item, idx) => (
                                        <span key={idx} className="bg-white text-emerald-700 border border-emerald-300 px-2 py-0.5 rounded-md text-[11px] font-bold shadow-xs">
                                            #{item}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        </aside>
                    </main>

                    {/* 📖 레시피 상세 조회 모달 */}
                    {selectedRecipeMenu && (
                        <div className="recipe-popup" onClick={() => setSelectedRecipeMenu(null)}>
                            <div className="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center border-b pb-3">
                                    <div>
                                        <span className="text-[10px] font-black text-blue-600 uppercase tracking-widest">Recipe Card</span>
                                        <h3 className="text-2xl font-black text-slate-800">{selectedRecipeMenu}</h3>
                                    </div>
                                    <button onClick={() => setSelectedRecipeMenu(null)} className="text-3xl font-thin text-slate-400">×</button>
                                </div>

                                <div className="space-y-3 text-xs font-bold text-slate-600">
                                    <div className="p-3 bg-slate-50 rounded-xl border">
                                        <span className="text-slate-400 text-[10px] block mb-1">주요 식재료 (Ingredients)</span>
                                        <p className="text-slate-700 font-black">{selectedRecipeMenu} 전용 원물 표준 배합비 적용 항목</p>
                                    </div>
                                    <div className="p-3 bg-slate-50 rounded-xl border">
                                        <span className="text-slate-400 text-[10px] block mb-1">조리 공정 (Instructions)</span>
                                        <ol className="list-decimal list-inside space-y-1 text-slate-700">
                                            <li>전처리 식재료 준비 및 정량 계량</li>
                                            <li>1차 가열 및 핏물/불순물 제거</li>
                                            <li>본 육수 추출 및 양념 믹싱 공정 진행</li>
                                        </ol>
                                    </div>
                                    <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-amber-800">
                                        <span className="text-[10px] font-black block mb-0.5">💡 Chef's Kick</span>
                                        <span>배합비 수치 준수 및 끓임 시간 엄수</span>
                                    </div>
                                </div>

                                <button onClick={() => setSelectedRecipeMenu(null)} className="w-full bg-slate-800 text-white py-2.5 rounded-xl font-black text-xs">닫기</button>
                            </div>
                        </div>
                    )}

                    {/* 📦 재고 관리 모달 */}
                    {inventoryModal && (
                        <div className="modal-view bg-slate-100">
                            <div className="flex justify-between items-center mb-4 bg-white p-4 rounded-2xl border shadow-sm">
                                <div>
                                    <h2 className="text-xl font-black text-emerald-700 italic">📦 명세서 드라이브 보관 및 재고 관리</h2>
                                    <p className="text-[10px] font-bold text-slate-400">명세서 촬영 시 구글 드라이브 보관 + 시트 자동 입고</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={fetchInventoryData} className="bg-slate-800 text-white px-2.5 py-1.5 rounded-xl text-xs font-black">🔄 새로고침</button>
                                    <button onClick={() => setInventoryModal(false)} className="text-2xl font-bold text-slate-400 px-2">×</button>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-2xl border shadow-sm mb-4 space-y-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-black text-slate-700">오늘 입고할 식재료 목록</span>
                                    <button onClick={handleAddRow} className="bg-slate-800 text-white px-2 py-1 rounded-lg text-xs font-black">+ 품목 추가</button>
                                </div>
                                
                                <div className="space-y-2">
                                    {inputItems.map((item, idx) => (
                                        <div key={idx} className="flex gap-2 items-center">
                                            <input className="flex-1 px-3 py-2 rounded-xl border text-xs font-bold outline-none" placeholder="품목명 (예: 한우꼬리 반골)" value={item.name} onChange={e => handleInputChange(idx, 'name', e.target.value)} />
                                            <input type="number" className="w-16 px-2 py-2 rounded-xl border text-xs font-bold text-center outline-none" value={item.inQty} onChange={e => handleInputChange(idx, 'inQty', Number(e.target.value))} />
                                            <button onClick={() => handleRemoveRow(idx)} className="text-red-500 font-bold px-2">×</button>
                                        </div>
                                    ))}
                                </div>

                                <label className="block w-full bg-emerald-600 text-white text-center py-3 rounded-xl font-black text-sm cursor-pointer shadow-md hover:bg-emerald-700">
                                    {isUploading ? "구글 드라이브 및 시트 저장 중..." : "📷 명세서 사진 찍고 시트에 자동 저장"}
                                    <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhotoAndSave} disabled={isUploading} />
                                </label>
                            </div>

                            <div className="flex-1 bg-white rounded-2xl border overflow-y-auto p-2 shadow-sm">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b bg-slate-50 text-[11px] font-black text-slate-500">
                                            <th className="p-2">품목명</th>
                                            <th className="p-2 text-center">입고량</th>
                                            <th className="p-2 text-center">사용량</th>
                                            <th className="p-2 text-center">현재재고</th>
                                            <th className="p-2 text-right">최근입고일</th>
                                            <th className="p-2 text-right">명세서 원본</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y text-xs font-bold">
                                        {isLoadingInv ? (
                                            <tr><td colSpan="6" className="p-4 text-center text-slate-400">데이터 불러오는 중...</td></tr>
                                        ) : inventoryList.length === 0 ? (
                                            <tr><td colSpan="6" className="p-4 text-center text-slate-400">등록된 재고 데이터가 없습니다. 상단에서 명세서를 저장해 보세요.</td></tr>
                                        ) : (
                                            inventoryList.map((item, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="p-2 font-black text-slate-800">{item.name}</td>
                                                    <td className="p-2 text-center font-black text-slate-700">{item.inQty}</td>
                                                    <td className="p-2 text-center">
                                                        <div className="flex items-center justify-center gap-1">
                                                            <button onClick={() => handleUpdateUsedQty(item, -1)} className="w-5 h-5 bg-slate-200 rounded font-black text-xs">-</button>
                                                            <span className="w-6 text-center text-indigo-600 font-black">{item.usedQty}</span>
                                                            <button onClick={() => handleUpdateUsedQty(item, 1)} className="w-5 h-5 bg-slate-200 rounded font-black text-xs">+</button>
                                                        </div>
                                                    </td>
                                                    <td className="p-2 text-center font-black text-sm text-emerald-600">{item.currentQty}</td>
                                                    <td className="p-2 text-right text-[10px] text-slate-400">{item.lastDate}</td>
                                                    <td className="p-2 text-right">
                                                        {item.note && item.note.includes("http") ? (
                                                            <a href={item.note} target="_blank" rel="noopener noreferrer" className="text-blue-600 underline font-black text-[10px]">📷 원본 사진</a>
                                                        ) : "-"}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* ⚙️ URL 설정 모달 (관리자 전용) */}
                    {urlSettingModal && currentUser === ADMIN_NAME && (
                        <div className="recipe-popup" onClick={() => setUrlSettingModal(false)}>
                            <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-black text-slate-800">⚙️ 구글 시트 웹앱 URL 등록</h3>
                                <p className="text-xs text-slate-500 font-bold">새로 배포하신 Apps Script 웹앱 URL을 입력해 주십시오.</p>
                                <input className="w-full p-3 border rounded-xl text-xs font-bold outline-none" placeholder="https://script.google.com/macros/s/.../exec" value={inputUrl} onChange={e => setInputUrl(e.target.value)} />
                                <div className="flex gap-2">
                                    <button onClick={saveWebAppUrl} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-black text-xs">저장 및 연결</button>
                                    <button onClick={() => setUrlSettingModal(false)} className="px-4 bg-slate-200 text-slate-700 py-2.5 rounded-xl font-black text-xs">취소</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<MiseOnApp />);
    </script>
</body>
</html>
