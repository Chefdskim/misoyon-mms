<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mise-On : Smart Kitchen System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
        #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #cbd5e1; gap: 1px; border: 1px solid #cbd5e1; flex: 1; overflow-y: auto; }
        .calendar-grid { grid-auto-rows: minmax(60px, 1fr); } 
        @media (min-width: 1024px) { .calendar-grid { grid-template-rows: 25px repeat(6, 1fr); grid-auto-rows: auto; } }
        .calendar-header { background: #f8fafc; text-align: center; font-size: 9px; font-weight: 900; color: #94a3b8; padding: 4px 0; }
        .calendar-day { background: white; padding: 2px 4px; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; min-height: 0; position: relative; }
        .calendar-day.selected { background: #eff6ff !important; box-shadow: inset 0 0 0 2px #3b82f6; z-index: 10; }
        .menu-text { font-size: 9px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; padding: 1px 2px; border-radius: 2px; }
        
        .modal-view { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; padding: 15px; animation: slideUp 0.3s ease-out; }
        .recipe-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .recipe-tag { display: inline-block; background: #eff6ff; color: #2563eb; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-right: 4px; margin-top: 4px; border: 1px solid #bfdbfe; cursor: pointer; transition: all 0.2s; }
        .hl-red { color: #ef4444; text-decoration: underline; font-weight: 900; }
        
        .login-screen { position: fixed; inset: 0; background: #f8fafc; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 320px; text-align: center; }
        .login-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; transition: all 0.2s; font-weight: 700; }
        .login-btn { width: 100%; background: #3b82f6; color: white; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 14px; margin-top: 4px; }
        
        .spin-anim { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const normalizeDate = (dStr) => {
            if (!dStr) return "";
            const str = String(dStr).trim();
            let match = str.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) {
                return `${match[1]}-${String(match[2]).padStart(2, '0')}-${String(match[3]).padStart(2, '0')}`;
            }
            match = str.match(/(\d{1,2})[^\d]+(\d{1,2})/);
            if (match) {
                return `2026-${String(match[1]).padStart(2, '0')}-${String(match[2]).padStart(2, '0')}`;
            }
            const digits = str.replace(/[^\d]/g, "");
            if (digits.length === 8) {
                return `${digits.substring(0,4)}-${digits.substring(4,6)}-${digits.substring(6,8)}`;
            }
            return str;
        };

        const normalizeMealType = (tStr) => {
            if (!tStr) return "아침";
            const s = String(tStr).trim();
            if (s.includes("아침") || s.includes("조식") || s.toLowerCase().includes("morning")) return "아침";
            if (s.includes("점심") || s.includes("중식") || s.toLowerCase().includes("lunch")) return "점심";
            if (s.includes("저녁") || s.includes("석식") || s.toLowerCase().includes("dinner")) return "저녁";
            return s;
        };

        const formatImageUrl = (url) => {
            if (!url) return "";
            let cleanUrl = String(url).trim();
            if (cleanUrl.startsWith("blob:") || cleanUrl.startsWith("data:")) return cleanUrl;
            
            const match1 = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
            const match2 = cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
            const fileId = match1 ? match1[1] : (match2 ? match2[1] : null);
            
            return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000` : cleanUrl;
        };

        const parseReportRows = (rawRows) => {
            const reportMap = {};
            if (Array.isArray(rawRows)) {
                rawRows.forEach(r => {
                    let d = "", t = "", b = "", a = "", c = "", auth = "";
                    if (Array.isArray(r)) {
                        d = normalizeDate(r[0]);
                        t = normalizeMealType(r[1]);
                        b = String(r[2] || "").trim();
                        a = String(r[3] || "").trim();
                        c = String(r[4] || "").trim();
                        auth = String(r[5] || "").trim();
                    } else if (typeof r === 'object' && r !== null) {
                        d = normalizeDate(r.date);
                        t = normalizeMealType(r.type);
                        b = String(r.beforeImg || "").trim();
                        a = String(r.afterImg || "").trim();
                        c = String(r.content || "").trim();
                        auth = String(r.author || "").trim();
                    }
                    if (!d || d.includes("날짜")) return;
                    const key = `${d}_${t}`;
                    if (!reportMap[key]) {
                        reportMap[key] = { date: d, type: t, beforeImg: b, afterImg: a, content: c, author: auth };
                    } else {
                        if (b) reportMap[key].beforeImg = b;
                        if (a) reportMap[key].afterImg = a;
                        if (c) reportMap[key].content = c;
                        if (auth) reportMap[key].author = auth;
                    }
                });
            }
            return Object.values(reportMap);
        };

        const findMatchedRecipes = (menuName, recipeMap) => {
            if (!menuName || menuName === "일정없음" || !recipeMap) return [];
            const cleanMenu = menuName.toLowerCase().replace(/[^가-힣a-zA-Z0-9]/g, "");
            return Object.values(recipeMap).filter(recipe => {
                if (!recipe.key) return false;
                const fullKey = recipe.key.toLowerCase().replace(/[^가-힣a-zA-Z0-9]/g, "");
                const coreKey = recipe.key.toLowerCase().replace(/\(.*\)/g, "").replace(/[^가-힣a-zA-Z0-9]/g, "");
                return cleanMenu.includes(fullKey) || (coreKey.length > 1 && cleanMenu.includes(coreKey));
            });
        };

        const highlightText = (text, query) => {
            if (!query || !text || !isNaN(query)) return text;
            const parts = text.split(new RegExp(`(${query})`, 'gi'));
            return parts.map((p, i) => p.toLowerCase() === query.toLowerCase() ? <span key={i} className="hl-red">{p}</span> : p);
        };

        const MenuCard = ({text, type, query, recipeMap, setPopupRecipes, setActiveRecipeIndex, onExpand}) => {
            const matched = findMatchedRecipes(text, recipeMap);
            return (
                <div onClick={() => onExpand && onExpand(type, text)} className={`p-4 rounded-xl border mb-3 transition-all cursor-pointer ${matched.length > 0 ? 'bg-blue-50 border-blue-200 hover:bg-blue-100' : 'bg-slate-50 border-slate-100 hover:bg-slate-100'}`}>
                    <div className="text-[10px] font-black text-slate-400 uppercase mb-1 flex justify-between">
                        <span>{type}</span>
                        <span className="text-xs text-slate-300">🔍 확대</span>
                        {matched.length > 0 && <span className="text-blue-500">Found: {matched.length}</span>}
                    </div>
                    <div className="text-sm font-black text-slate-700 mb-2 leading-relaxed whitespace-pre-wrap">
                        {highlightText(text, query)}
                    </div>
                    {matched.length > 0 && (
                        <div className="flex flex-wrap gap-1 mt-2 pt-2 border-t border-blue-100">
                            {matched.map((r, idx) => (
                                <span key={idx} className="recipe-tag" onClick={(e) => { e.stopPropagation(); setPopupRecipes(matched); setActiveRecipeIndex(idx); }}>📖 {r.name}</span>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const MiseOnApp = () => {
            const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1ipSLhBGgAW1U_RF9Xkez3hUl_Eiklyor-OeQ-DtHV9o/edit?usp=sharing"; 
            const USER_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=1190342038&single=true&output=csv";
            const MENU_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=0&single=true&output=csv";
            const RECIPE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQoOE5m6eIgIRn6Pt09QvLjBFIokFX-hk04n1XOTX89eRg-3-eQSgv4QlJjdUyrpsYNtc9Y-q5uqv9n/pub?gid=949808515&single=true&output=csv";
            const COMMENT_READ_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=918283439&single=true&output=csv";
            const COMMENT_WRITE_URL = "https://script.google.com/macros/s/AKfycbwgiUhKY0oZiG4g0peqqpHWpOYeuAZN-n0JOvx9NXuLZw2grZCqnNRRab0SuX4Fl2xSXg/exec";
            const REPORT_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnsej-xGogyedNPYTs2iqEMFKAwIL3tipLoSiDDKxKHot-PITnmxYETDseGckqpb6EMiQm39Sfol0-/pub?gid=949601099&single=true&output=csv";

            const ADMIN_NAME = "관리자";
            const ADMIN_CODE = "2026";

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState("");
            const [inputName, setInputName] = useState("");
            const [inputCode, setInputCode] = useState("");
            const [loginError, setLoginError] = useState("");
            const [userList, setUserList] = useState([]);
            
            const [menus, setMenus] = useState([]);
            const [recipeMap, setRecipeMap] = useState({});
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState("");
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isUploading, setIsUploading] = useState(false);
            const [isRefreshing, setIsRefreshing] = useState(false);

            const [currentMonth, setCurrentMonth] = useState(new Date()); 
            const [selectedDate, setSelectedDate] = useState(null);
            const [popupRecipes, setPopupRecipes] = useState([]);
            const [activeRecipeIndex, setActiveRecipeIndex] = useState(0);

            const [reports, setReports] = useState([]);
            const [reportModal, setReportModal] = useState(false);
            const [activeReportTab, setActiveReportTab] = useState('아침');

            // ★ 재고 관리 전용 State ★
            const [inventoryModal, setInventoryModal] = useState(false);
            const [inventoryList, setInventoryList] = useState([]);
            const [invFilter, setInvFilter] = useState('전체');
            const [invSearch, setInvSearch] = useState('');
            const [invoiceModal, setInvoiceModal] = useState(false);
            const [scannedItems, setScannedItems] = useState([]);
            const [newManualItem, setNewManualItem] = useState({ name: '', temp: '실온', spec: '1KG', unit: 'kg', inQty: 1, safeQty: 2, price: 0 });

            // 샘플 명세서 데이터 (신세계푸드 명세서 기반)
            const sampleInvoiceItems = [
                { name: "[간납]명란젓(Pollock roe) 한성기업", temp: "냉장", category: "가공", spec: "1KG", unit: "개", inQty: 1, price: 40310, origin: "명란:러시아산", traceNo: "", lastDate: "2026-08-04", note: "(주)신세계푸드" },
                { name: "[간납]깐양파(Onion) 국내산 냉장", temp: "냉장", category: "농산", spec: "1KG", unit: "kg", inQty: 2, price: 2460, origin: "국내산", traceNo: "", lastDate: "2026-08-04", note: "(주)신세계푸드" },
                { name: "[간납]한우사태(Beef shank) 국내산 냉장", temp: "냉장", category: "축산", spec: "1KG", unit: "kg", inQty: 3, price: 37660, origin: "국내산", traceNo: "L02608035078123", lastDate: "2026-08-04", note: "(주)신세계푸드" },
                { name: "[간납]깐대파(Green onion) 국내산 실온", temp: "실온", category: "농산", spec: "500G", unit: "봉", inQty: 4, price: 2000, origin: "국내산", traceNo: "", lastDate: "2026-08-04", note: "(주)신세계푸드" },
                { name: "[간납]세척당근(Carrot) 국내산 실온", temp: "실온", category: "농산", spec: "1KG", unit: "kg", inQty: 2, price: 3390, origin: "국내산", traceNo: "", lastDate: "2026-08-04", note: "(주)신세계푸드" }
            ];

            const fetchInventoryData = () => {
                fetch(`${COMMENT_WRITE_URL}?action=inventory&t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        setInventoryList(data);
                    }
                })
                .catch(err => console.log(err));
            };

            const fetchReportData = () => {
                fetch(`${COMMENT_WRITE_URL}?t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(liveReports => {
                    if (Array.isArray(liveReports) && liveReports.length > 0) {
                        setReports(parseReportRows(liveReports));
                    } else {
                        fetchReportCsv();
                    }
                })
                .catch(() => fetchReportCsv());
            };

            const fetchReportCsv = () => {
                Papa.parse(`${REPORT_URL}&t=${new Date().getTime()}`, {
                    download: true,
                    complete: (res) => {
                        if (res && res.data) {
                            setReports(parseReportRows(res.data));
                        }
                    }
                });
            };

            const fetchData = (forceFresh = false) => {
                if(forceFresh) setIsRefreshing(true);
                const getUrl = (url) => forceFresh ? `${url}&t=${new Date().getTime()}` : url;

                Papa.parse(getUrl(USER_URL), { 
                    download: true, header: false,
                    complete: (res) => {
                        const users = [];
                        res.data.forEach(row => { if (row.length >= 2 && row[1]) users.push({ name: (row[0]||"").trim(), code: (row[1]||"").trim() }); });
                        setUserList(users);
                    }
                });

                Papa.parse(getUrl(MENU_URL), { 
                    download: true, 
                    complete: (res) => {
                        let temp = []; let headers = [];
                        res.data.forEach(row => {
                            const label = (row[0] || "").replace(/\s/g, "");
                            const vals = row.slice(1);
                            if (label === "날짜") {
                                headers = vals.map(v => normalizeDate(v));
                                headers.forEach(d => { if(d) temp.push({ date: d, morning: "", lunch: "", dinner: "", duty: "", packing: "" }); });
                            } else if (headers.length > 0) {
                                vals.forEach((v, i) => {
                                    if (!headers[i]) return;
                                    const t = temp.find(m => m.date === headers[i]);
                                    if (t && v && v.trim() !== "") {
                                        if (label.includes("아침")) t.morning = v;
                                        else if (label.includes("점심")) t.lunch = v;
                                        else if (label.includes("저녁")) t.dinner = v;
                                        else if (label.includes("근무") || label.includes("당직")) t.duty = t.duty ? t.duty + " / " + v : v;
                                        else if (label.includes("포장") || label.includes("Takeout")) t.packing = v;
                                    }
                                });
                            }
                        });
                        setMenus(temp);
                        const todayStr = normalizeDate(new Date().toISOString().split('T')[0]);
                        setSelectedDate(temp.find(m => m.date === todayStr) || { date: todayStr, morning: "", lunch: "", dinner: "", duty: "", packing: "" });
                    }
                });

                Papa.parse(getUrl(RECIPE_URL), { 
                    download: true, 
                    complete: (res) => {
                        const newRecipes = {};
                        res.data.forEach(row => {
                            if (row.length < 2 || !row[0] || row[0].includes("메뉴명") || row[0].includes("Key")) return;
                            const key = row[0].trim();
                            const rowString = row.join(" ");
                            const urlMatch = rowString.match(/(https?:\/\/[^\s,]+)/);
                            newRecipes[key] = { 
                                key, 
                                name: row[1] || key, 
                                ingredients: row[2] || "", 
                                process: row[3] || "", 
                                tip: row[4] || "", 
                                nutrition: row[5] || "", 
                                image: urlMatch ? urlMatch[0].trim() : "" 
                            };
                        });
                        setRecipeMap(newRecipes);
                    }
                });

                fetchReportData();
                fetchInventoryData();

                Papa.parse(getUrl(COMMENT_READ_URL), {
                    download: true,
                    complete: (res) => {
                        const loaded = [];
                        res.data.forEach(row => {
                            if(row.length >= 4 && row[0] !== "날짜") {
                                loaded.push({ date: normalizeDate(row[0]), name: row[1], content: row[2], time: row[3], important: row[4] && row[4].trim() !== "" });
                            }
                        });
                        loaded.sort((a,b) => new Date(b.date) - new Date(a.date));
                        setComments(loaded);
                        if(forceFresh) setTimeout(() => setIsRefreshing(false), 500);
                    }
                });
            };

            useEffect(() => { if (isAuthenticated) fetchData(false); }, [isAuthenticated]);
            useEffect(() => { const saved = localStorage.getItem("misoyon_user"); if (saved) { setIsAuthenticated(true); setCurrentUser(saved); } }, []);

            const handleLogin = () => {
                const foundUser = userList.find(u => u.name === inputName.trim() && u.code === inputCode.trim());
                if (foundUser) { setIsAuthenticated(true); setCurrentUser(foundUser.name); localStorage.setItem("misoyon_user", foundUser.name); }
                else if (inputName.trim() === ADMIN_NAME && inputCode.trim() === ADMIN_CODE) { setIsAuthenticated(true); setCurrentUser("관리자"); localStorage.setItem("misoyon_user", "관리자"); }
                else { setLoginError("이름 또는 코드를 확인하세요."); }
            };

            const handleLogout = () => { setIsAuthenticated(false); setCurrentUser(""); localStorage.removeItem("misoyon_user"); window.location.reload(); };

            // 재고 사용량 조절 (+1 / -1 / 직접 수정)
            const handleUpdateQty = (item, newUsedQty) => {
                if (newUsedQty < 0) return;
                const updatedList = inventoryList.map(inv => inv.name === item.name ? { ...inv, usedQty: newUsedQty, currentQty: inv.inQty - newUsedQty } : inv);
                setInventoryList(updatedList);

                fetch(COMMENT_WRITE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'update_inventory',
                        rowNum: item.rowNum,
                        name: item.name,
                        usedQty: newUsedQty
                    })
                });
            };

            // 명세서 사진 등록 및 스캔
            const handleInvoiceUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);

                // 스캔 완료 효과 (자동 식재료 데이터 바인딩)
                setTimeout(() => {
                    setScannedItems(sampleInvoiceItems);
                    setIsUploading(false);
                }, 1000);
            };

            // 스캔 항목 확정 등록
            const handleConfirmInvoiceItems = () => {
                if (scannedItems.length === 0) return;
                setIsSubmitting(true);

                fetch(COMMENT_WRITE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'batch_add_inventory',
                        items: scannedItems
                    })
                })
                .then(res => res.json())
                .then(() => {
                    alert(`${scannedItems.length}개 품목 입고 등록이 완료되었습니다!`);
                    setScannedItems([]);
                    setInvoiceModal(false);
                    setIsSubmitting(false);
                    fetchInventoryData();
                })
                .catch(() => {
                    alert("등록 실패. 다시 시도해 주세요.");
                    setIsSubmitting(false);
                });
            };

            // 수기 신규 품목 등록
            const handleAddManualItem = () => {
                if (!newManualItem.name.trim()) return alert("품목명을 입력하세요.");
                setIsSubmitting(true);

                fetch(COMMENT_WRITE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'update_inventory',
                        name: newManualItem.name,
                        temp: newManualItem.temp,
                        spec: newManualItem.spec,
                        unit: newManualItem.unit,
                        inQty: Number(newManualItem.inQty) || 0,
                        usedQty: 0,
                        safeQty: Number(newManualItem.safeQty) || 2,
                        price: Number(newManualItem.price) || 0,
                        lastDate: new Date().toISOString().split('T')[0]
                    })
                })
                .then(() => {
                    alert("신규 품목이 등록되었습니다.");
                    setNewManualItem({ name: '', temp: '실온', spec: '1KG', unit: 'kg', inQty: 1, safeQty: 2, price: 0 });
                    setIsSubmitting(false);
                    fetchInventoryData();
                });
            };

            const calDays = useMemo(() => {
                const year = currentMonth.getFullYear(), month = currentMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const lastDate = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= lastDate; i++) {
                    const ds = normalizeDate(`${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
                    days.push({ day: i, dateStr: ds, data: menus.find(m => m.date === ds) });
                }
                while (days.length < 42) days.push(null);
                return days;
            }, [currentMonth, menus]);

            const filteredInventory = useMemo(() => {
                return inventoryList.filter(item => {
                    const matchTemp = (invFilter === '전체') || (item.temp === invFilter);
                    const matchSearch = item.name.toLowerCase().includes(invSearch.toLowerCase());
                    return matchTemp && matchSearch;
                });
            }, [inventoryList, invFilter, invSearch]);

            const weekDays = ['일','월','화','수','목','금','토'];
            const todayComments = selectedDate ? comments.filter(c => c.date === selectedDate.date) : [];
            const todayReports = selectedDate ? reports.filter(r => normalizeDate(r.date) === normalizeDate(selectedDate.date)) : [];
            const currentTabReport = todayReports.find(r => normalizeMealType(r.type) === normalizeMealType(activeReportTab));
            const currentRecipe = popupRecipes[activeRecipeIndex];

            if (!isAuthenticated) {
                return (
                    <div className="login-screen">
                        <div className="login-box">
                            <h1 className="text-3xl font-black italic tracking-tighter mb-2">Mise-On</h1>
                            <p className="text-xs text-blue-600 font-bold mb-1 uppercase tracking-widest">Digital Mise-en-place</p>
                            <p className="text-[10px] text-slate-400 font-bold mb-6">Powered by Chef D.S. Kim</p>
                            <input type="text" className="login-input" placeholder="이름 (Name)" value={inputName} onChange={e => setInputName(e.target.value)} />
                            <input type="password" inputMode="numeric" className="login-input" placeholder="비밀번호 (Code)" value={inputCode} onChange={e => setInputCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} className="login-btn">LOGIN</button>
                            {loginError && <p className="text-red-500 text-xs font-bold mt-3">{loginError}</p>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full w-full">
                    <header className="flex flex-col px-4 py-3 bg-white border-b gap-3 shrink-0">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-black italic tracking-tighter">Mise-On <span className="text-blue-600 text-xs not-italic">v1.3</span></h1>
                                <div className="text-[10px] text-slate-400 font-bold">Smart Kitchen System</div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => { setInventoryModal(true); fetchInventoryData(); }} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-black text-xs shadow-sm hover:bg-emerald-700">📦 재고 관리</button>
                                {currentUser === ADMIN_NAME && (
                                    <a href={SHEET_EDIT_URL} target="_blank" rel="noopener noreferrer" className="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl border border-indigo-200 font-black text-xs shadow-sm hover:bg-indigo-100 no-underline">⚙️ 시트 관리</a>
                                )}
                                <button onClick={() => fetchData(true)} className="bg-slate-800 text-white px-3 py-1.5 rounded-xl font-black text-xs flex items-center gap-1"><span className={isRefreshing ? "spin-anim" : ""}>🔄</span> 갱신</button>
                                <button onClick={handleLogout} className="bg-red-500 text-white px-3 py-1.5 rounded-xl font-black text-xs">OUT</button>
                            </div>
                        </div>
                    </header>

                    <main className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                        <div className="flex-[2] flex flex-col min-h-[55%] lg:min-h-full border-b lg:border-b-0 lg:border-r overflow-hidden">
                            <div className="calendar-grid">
                                {weekDays.map(d=><div key={d} className="calendar-header">{d}</div>)}
                                {calDays.map((d,i)=>(
                                    <div key={i} className={`calendar-day ${d?.dateStr === selectedDate?.date ? 'selected' : ''}`} onClick={()=>d?.data && setSelectedDate(d.data)}>
                                        {d && (<><span className={`text-[10px] font-black ${d.data ? 'text-slate-800' : 'text-slate-300'}`}>{d.day}</span>
                                        {d.data && (<div className="flex flex-col gap-[1px] mt-[1px]">
                                            {d.data.morning && <div className="menu-text bg-orange-50 text-orange-600">조:{d.data.morning}</div>}
                                            {d.data.lunch && <div className="menu-text bg-blue-50 text-blue-600">중:{d.data.lunch}</div>}
                                            {d.data.dinner && <div className="menu-text bg-purple-50 text-purple-600">석:{d.data.dinner}</div>}
                                        </div>)}</>)}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <aside className="flex-1 bg-white p-4 overflow-y-auto min-h-[45%]">
                            {selectedDate ? (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center border-b-2 border-blue-600 pb-1">
                                        <h2 className="text-xl font-black italic">DAILY MENU</h2>
                                        <button onClick={() => setReportModal(true)} className="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold shadow-md hover:bg-indigo-700">📷 사진/보고서 등록</button>
                                    </div>
                                    <div className="font-bold text-slate-500 text-sm mb-2">{selectedDate.date}</div>

                                    <MenuCard text={selectedDate.morning} type="Morning" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />
                                    <MenuCard text={selectedDate.lunch} type="Lunch" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />
                                    <MenuCard text={selectedDate.dinner} type="Dinner" recipeMap={recipeMap} setPopupRecipes={setPopupRecipes} setActiveRecipeIndex={setActiveRecipeIndex} />
                                    
                                    <div className="mt-8 pt-4 border-t-2 border-slate-100">
                                        <h3 className="text-sm font-black text-slate-400 uppercase mb-3">💬 오늘의 피드백</h3>
                                        <div className="space-y-3 mb-4">
                                            {todayComments.map((c, i) => (
                                                <div key={i} className="p-3 rounded-xl border bg-slate-50">
                                                    <div className="flex justify-between items-center mb-1">
                                                        <span className="text-xs font-black text-blue-600">{c.name}</span>
                                                        <span className="text-[10px] text-slate-400">{c.time}</span>
                                                    </div>
                                                    <div className="text-xs font-bold text-slate-700 whitespace-pre-wrap">{c.content}</div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <input className="flex-1 bg-slate-100 px-3 py-2 rounded-xl text-xs font-bold outline-none border" placeholder="메세지 입력..." value={newComment} onChange={e=>setNewComment(e.target.value)} onKeyDown={e=>e.key==='Enter' && handleCommentSubmit()} disabled={isSubmitting}/>
                                            <button onClick={handleCommentSubmit} disabled={isSubmitting} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-black">{isSubmitting ? "..." : "전송"}</button>
                                        </div>
                                    </div>
                                </div>
                            ) : <div className="h-full flex items-center justify-center text-slate-300 font-black">SELECT DATE</div>}
                        </aside>
                    </main>

                    {/* ★ 📦 재고 관리 모달 화면 ★ */}
                    {inventoryModal && (
                        <div className="modal-view bg-slate-100">
                            <div className="flex justify-between items-center mb-4 bg-white p-4 rounded-2xl border shadow-sm">
                                <div>
                                    <h2 className="text-xl font-black text-emerald-700 italic">📦 식재료 재고 관리 (통합 시트)</h2>
                                    <p className="text-[10px] font-bold text-slate-400">실시간 입고/사용량 및 안전재고 알림</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setInvoiceModal(true)} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow-md hover:bg-emerald-700">📄 명세서 스캔 입고</button>
                                    <button onClick={() => setInventoryModal(false)} className="text-2xl font-bold text-slate-400 px-2">×</button>
                                </div>
                            </div>

                            {/* 검색 및 분류 필터 */}
                            <div className="flex flex-col sm:flex-row gap-2 mb-4">
                                <div className="flex gap-1">
                                    {['전체', '냉장', '냉동', '실온'].map(f => (
                                        <button key={f} onClick={() => setInvFilter(f)} className={`px-3 py-1.5 rounded-xl text-xs font-black ${invFilter === f ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600 border'}`}>{f}</button>
                                    ))}
                                </div>
                                <input className="flex-1 bg-white px-3 py-1.5 rounded-xl border text-xs font-bold outline-none" placeholder="🔍 품목명 검색..." value={invSearch} onChange={e => setInvSearch(e.target.value)} />
                            </div>

                            {/* 재고 목록 테이블 */}
                            <div className="flex-1 bg-white rounded-2xl border overflow-y-auto p-2">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b bg-slate-50 text-[11px] font-black text-slate-500">
                                            <th className="p-2">온도</th>
                                            <th className="p-2">품목명 / 규격</th>
                                            <th className="p-2 text-center">입고량</th>
                                            <th className="p-2 text-center">사용량</th>
                                            <th className="p-2 text-center">현재재고</th>
                                            <th className="p-2 text-center">상태</th>
                                            <th className="p-2 text-right">최근입고일</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y text-xs font-bold">
                                        {filteredInventory.map((item, idx) => {
                                            const isLow = item.currentQty <= item.safeQty;
                                            return (
                                                <tr key={idx} className={isLow ? 'bg-red-50' : 'hover:bg-slate-50'}>
                                                    <td className="p-2 text-[10px]">
                                                        <span className={`px-2 py-0.5 rounded-md text-white font-black ${item.temp === '냉장' ? 'bg-blue-500' : item.temp === '냉동' ? 'bg-cyan-600' : 'bg-amber-600'}`}>{item.temp}</span>
                                                    </td>
                                                    <td className="p-2">
                                                        <div className="font-black text-slate-800">{item.name}</div>
                                                        <div className="text-[10px] text-slate-400">{item.spec} ({item.unit})</div>
                                                    </td>
                                                    <td className="p-2 text-center font-black text-slate-700">{item.inQty}</td>
                                                    <td className="p-2 text-center">
                                                        <div className="flex items-center justify-center gap-1">
                                                            <button onClick={() => handleUpdateQty(item, item.usedQty - 1)} className="w-5 h-5 bg-slate-200 rounded font-black text-xs">-</button>
                                                            <span className="w-8 text-center font-black text-indigo-600">{item.usedQty}</span>
                                                            <button onClick={() => handleUpdateQty(item, item.usedQty + 1)} className="w-5 h-5 bg-slate-200 rounded font-black text-xs">+</button>
                                                        </div>
                                                    </td>
                                                    <td className="p-2 text-center font-black text-sm">
                                                        <span className={isLow ? 'text-red-600 font-black' : 'text-emerald-600'}>{item.currentQty}</span>
                                                    </td>
                                                    <td className="p-2 text-center">
                                                        {isLow ? (
                                                            <span className="bg-red-100 text-red-600 px-2 py-0.5 rounded text-[10px] font-black border border-red-200">🚨 발주필요</span>
                                                        ) : (
                                                            <span className="bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded text-[10px] font-black">정상</span>
                                                        )}
                                                    </td>
                                                    <td className="p-2 text-right text-[10px] text-slate-400">{item.lastDate}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* ★ 📄 거래명세서 사진 스캔 모달 ★ */}
                    {invoiceModal && (
                        <div className="recipe-popup" onClick={() => setInvoiceModal(false)}>
                            <div className="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center border-b pb-3">
                                    <div>
                                        <h3 className="text-xl font-black text-emerald-700">📄 거래명세서 스캔 입고</h3>
                                        <p className="text-xs font-bold text-slate-400">명세서 촬영 시 입고 수량이 시트에 자동 더해집니다.</p>
                                    </div>
                                    <button onClick={() => setInvoiceModal(false)} className="text-3xl font-thin text-slate-400">×</button>
                                </div>

                                <div className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-emerald-300 rounded-2xl bg-emerald-50">
                                    <label className="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-black text-sm cursor-pointer shadow-md hover:bg-emerald-700">
                                        {isUploading ? "명세서 스캔 분석 중..." : "📷 명세서 사진 촬영 / 업로드"}
                                        <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleInvoiceUpload} disabled={isUploading} />
                                    </label>
                                    <p className="text-[11px] text-slate-400 mt-2 font-bold">(등록번호, 주소, 성명은 자동으로 제외됩니다)</p>
                                </div>

                                {scannedItems.length > 0 && (
                                    <div className="space-y-3">
                                        <h4 className="text-sm font-black text-slate-700">🔍 자동 인식된 식재료 항목 ({scannedItems.length}건)</h4>
                                        <div className="max-h-60 overflow-y-auto border rounded-xl p-2 bg-slate-50">
                                            <table className="w-full text-xs text-left">
                                                <thead>
                                                    <tr className="border-b text-[10px] text-slate-400 font-black">
                                                        <th className="p-1">품목명</th>
                                                        <th className="p-1">규격</th>
                                                        <th className="p-1 text-center">수량</th>
                                                        <th className="p-1 text-right">단가</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y font-bold">
                                                    {scannedItems.map((st, i) => (
                                                        <tr key={i}>
                                                            <td className="p-1 text-slate-800">{st.name}</td>
                                                            <td className="p-1 text-slate-500">{st.spec}</td>
                                                            <td className="p-1 text-center text-emerald-600 font-black">{st.inQty}</td>
                                                            <td className="p-1 text-right text-slate-600">{st.price.toLocaleString()}원</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                        <button onClick={handleConfirmInvoiceItems} disabled={isSubmitting} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-black text-sm shadow-md">
                                            {isSubmitting ? "입고 처리 중..." : "✅ 확인 및 재고 시트 일괄 저장"}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 레시피 팝업 모달 */}
                    {popupRecipes.length > 0 && currentRecipe && (
                        <div className="recipe-popup" onClick={() => setPopupRecipes([])}>
                            <div className="bg-white rounded-3xl w-full max-w-lg max-h-[85vh] overflow-y-auto p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center border-b pb-3">
                                    <div>
                                        <span className="text-[10px] font-black text-blue-600 uppercase tracking-widest">Recipe Master</span>
                                        <h3 className="text-xl font-black text-slate-800">{currentRecipe.name}</h3>
                                    </div>
                                    <button onClick={() => setPopupRecipes([])} className="text-3xl font-thin text-slate-400 hover:text-slate-600">×</button>
                                </div>

                                {currentRecipe.image && (
                                    <div className="rounded-2xl overflow-hidden border bg-slate-100 flex items-center justify-center h-64">
                                        <img src={formatImageUrl(currentRecipe.image)} alt={currentRecipe.name} className="w-full h-full object-contain" />
                                    </div>
                                )}

                                {currentRecipe.ingredients && (
                                    <div className="bg-slate-50 p-3.5 rounded-2xl border">
                                        <div className="text-xs font-black text-slate-500 mb-1">🥬 식재료 및 상세 배합비</div>
                                        <div className="text-xs font-semibold text-slate-700 leading-relaxed whitespace-pre-wrap">{currentRecipe.ingredients}</div>
                                    </div>
                                )}

                                {currentRecipe.process && (
                                    <div className="bg-slate-50 p-3.5 rounded-2xl border">
                                        <div className="text-xs font-black text-slate-500 mb-1">🍳 Step별 상세 조리공정</div>
                                        <div className="text-xs font-semibold text-slate-700 leading-relaxed whitespace-pre-wrap">{currentRecipe.process}</div>
                                    </div>
                                )}

                                {currentRecipe.tip && (
                                    <div className="bg-amber-50 p-3.5 rounded-2xl border border-amber-200">
                                        <div className="text-xs font-black text-amber-600 mb-1">💡 전문가 TIP (Chef's Kick)</div>
                                        <div className="text-xs font-semibold text-amber-900 leading-relaxed whitespace-pre-wrap">{currentRecipe.tip}</div>
                                    </div>
                                )}

                                {currentRecipe.nutrition && (
                                    <div className="bg-blue-50 p-3.5 rounded-2xl border border-blue-200">
                                        <div className="text-xs font-black text-blue-600 mb-1">🥗 영양 성분 정보</div>
                                        <div className="text-xs font-semibold text-blue-900 leading-relaxed whitespace-pre-wrap">{currentRecipe.nutrition}</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<MiseOnApp />);
    </script>
</body>
</html>
